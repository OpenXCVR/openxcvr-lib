[package]
name = "openxcvr-cmis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
description = "CMIS 5.3 (QSFP-DD / OSFP / DSFP) adapter for the openxcvr universal transceiver library"
readme = "README.md"
keywords = ["transceiver", "qsfp-dd", "osfp", "cmis", "optics"]
categories = ["hardware-support", "encoding", "parser-implementations"]
publish = false

[dependencies]
openxcvr-core = { path = "../openxcvr-core", version = "0.2.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cmis-prerequisite-receipt"
path = "src/bin/cmis-prerequisite-receipt.rs"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
