fields:

  - name: mod_hsout_invoke_tuning_trig
    display_name: "ModHsOut<lane>InvokeTuningTrig"
    description: "Host indicates a Tuning Request Raised (TRR) for lane <lane>; the module clears the bit when it reads (self-clearing). 0: no tuning request, 1: tuning request for lane <lane>. H2M message bit."
    instances: { index: lane, start: 1, end: 8 }
    offset: 226
    bit_offset_expr: "lane - 1"
    bit_width: 1
    type: bool
    access: wo_sc
    field_type: Control
    tags: [CMIS-LT, Trigger, Tuning, Ingress]
    scope: { lane: lane }
    flags: { is_required: true, is_readable: false, is_writable: true, is_ever_writable: true, is_dynamic: true }
    provenance: { section: "OIF-CMIS-LT-01.0 § 6.5", pdf_page: 67, table: "Table 73" }

  - name: mod_hsout_tuning_completed_flag
