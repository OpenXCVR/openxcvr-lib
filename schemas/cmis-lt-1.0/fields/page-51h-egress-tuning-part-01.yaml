fields:

  - name: host_out_ffe_tap_1
    display_name: "HostOut<lane>FfeTap1"
    description: "SM8-encoded FFE tap 1 value for HostOut lane <lane>: sign in bit 7 (0 positive, 1 negative), magnitude 0..127 in bits 6-0 with 0.01 per LSB, i.e. a tap value range of -1.27 to +1.27. Shared-memory in/out parameter of the tap setting and tuning procedures; when advertised, the host keeps the register current under tuning operations and preset loading."
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "128 + (lane - 1) * 8 + 0"
    type: u8
    access: rww
    units: "0.01 (tap magnitude; bit 7 is the sign)"
    field_type: Control
    tags: [CMIS-LT, FFE, Tap, Egress]
    scope: { lane: lane }
    flags: { is_required: false, is_readable: true, is_writable: true, is_ever_writable: true, is_dynamic: true }
    provenance: { section: "OIF-CMIS-LT-01.0 § 6.3", pdf_page: 49, table: "Table 31" }

