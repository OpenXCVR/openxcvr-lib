  - name: host_out_invoke_tuning_flag
    display_name: "HostOut<lane>InvokeTuningFlag"
    description: "Tuning procedure invoked per lane: 0: no tuning request for lane <lane>, 1: tuning request for lane <lane>; the type of tuning requested (amplitude or taps) is programmed in HostOut<lane>TuningType. M2H message bit, clear on read."
