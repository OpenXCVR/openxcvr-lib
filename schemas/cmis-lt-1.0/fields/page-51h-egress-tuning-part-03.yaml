  - name: host_out_tuning_completed_trig
    display_name: "HostOut<lane>TuningCompletedTrig"
    description: "The host notifies the module about completion of a tuning procedure for lane <lane> (with or without success): 0: no tuning requested or not yet completed, 1: requested operation completed. H2M message bit, self-clearing."
