---
schema: openxcvr.enum.v2
kind: enum
id: CmisLtSqmAlarmThreshold
title: "CMIS-LT 1.0 SQM Degraded Alarm Threshold"
spec:
  id: cmis-lt-1.0
  revision: "01.0"
  parity_deferred: true
provenance:
  spec: "OIF-CMIS-LT-01.0 §§ 6.2.2 and 6.4.2 (Tables 13, 48)"
  pdf_pages: [41, 57]
entries:
  - value: 0x0
    name: none
    description: "No degradation alarm"
  - value: 0x1
    name: minor
    description: "Minor degradation (e.g. delta SQM <= 0.5 dB)"
  - value: 0x2
    name: major
    description: "Major degradation (e.g. delta SQM <= 1-2 dB)"
  - value: 0x3
    name: severe
    description: "Severe degradation (e.g. delta SQM <= 3 dB)"
