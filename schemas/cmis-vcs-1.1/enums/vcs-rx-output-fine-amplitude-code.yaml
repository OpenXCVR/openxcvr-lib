schema: openxcvr.enum.v2
kind: enum
id: CmisVcsRxOutputFineAmplitudeCode
title: CMIS-VCS 1.1 Rx Output Fine Amplitude Code
spec:
  id: cmis-vcs-1.1
  revision: "01.1"
  parity_deferred: true
description: >-
  Code values of the OutputAmplitudeSettingRx<i> register (VCS Parameter
  ID 0Eh), OIF-CMIS-VCS-01.1 § 5.16 Table 5-35. The fine amplitude setting
  has 50 mV peak-to-peak resolution from 250 mV to 1000 mV, finer than the
  CMIS base amplitude target codes. The amplitude is measured without Rx
  output equalization at a test point defined by the relevant standard.
provenance:
  spec: OIF-CMIS-VCS-01.1 § 5.16 Table 5-35
  pdf_pages: [49]
