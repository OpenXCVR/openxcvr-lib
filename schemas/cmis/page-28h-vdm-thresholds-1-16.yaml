    size_bytes: 2
    type: u16be
    template: vdm_threshold_field
    scope: { threshold_set: threshold_set }
    behavior: { wire_type: x16be, decode_type_source: "VDM descriptor observable_type using this threshold set" }
    provenance: { section: "CMIS 5.3 § 8.22.3", pdf_page: 276, table: "Table 8-172", quote: "HighAlarmThreshold1" }

