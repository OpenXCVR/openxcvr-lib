schema: openxcvr.page.v2
kind: page
id: CmisPage9FhCdbMessage
title: CMIS Page 9Fh CDB Message (banked)
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 8.23
  pdf_pages: [281, 282, 283, 284, 285, 286]
page_address: "9Fh"
size_bytes: 128
present_when: "page_01h_advertising.cdb_instances_supported > 0"

# Banked by CDB messaging instance. Each Bank of Page 9Fh pairs with the same
# Bank of Pages A0h-AFh to form one independent CDB command/reply exchange
# facility. Codegen and L2 adapters own the bank-to-instance arithmetic.
banking:
  bank_count_field: page_01h_advertising.cdb_instances_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: cdb_instance
  dimension_size: 1

