          pdf_page: 282
          access: "RW"
          basis: "§ 8.1.3.6, Table 8-3 (p. 138): RW reads have no COR effect. Command execution is a WRITE/STOP effect at byte 129, not a read effect. Qualification is for CMIS 5.3 only."
    behavior: { write_trigger: cdb_command_execution, trigger_byte: "9Fh:129" }
