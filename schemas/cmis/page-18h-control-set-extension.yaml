schema: openxcvr.page.v1
kind: page
id: CmisPage18hControlSetExtension
title: CMIS Page 18h Lane Control and Data Path Control Part 2 (banked)
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 8.17
  pdf_pages: [262, 263, 264]
page_address: "18h"
size_bytes: 128

# Banked across lanes per 's bank-relative scope convention. Each
# bank carries a group of 8 lanes selected through the lower-memory bank select.
# CMIS 5.4 § 4.1.1 / § 8.1.2 expands lane banking to up to 32 banks
# (256 lanes): BanksSupported = 11b (01h:142.1-0, CmisBanksSupported5p4)
# is the escape code and 01h:174.4-0 ExtraLaneBanksSupported carries the
# extra bank count. Through CMIS 5.3 the maximum is 4 banks (32 lanes).
banking:
  bank_count_field: page_01h_advertising.banks_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: lane
  dimension_size: 8

fields:

  # ===========================================================================
  # CMIS 5.3 § 8.17.1 Staged Control Set Extension - Application Descriptors
  # Block Indices (bytes 128-143) - Tables 8-156 and 8-157
  # ===========================================================================

  - name: scs0_nad_block_index
    display_name: SCS0NADBlockIndex<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "128 + (lane - 1)"
    bit_offset_expr: "0"
    bit_width: 4
    type: u4
    access: rw
    field_type: OperationalParameter
    tags: [OperationalParameter]
    scope: { lane: lane, control_set: { id: 0, kind: staged } }
    flags:
      is_required: false
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    changed_in:
      - rev: "5.4"
        bit_width: 8
        provenance:
          section: "CMIS 5.4 § 8.21.1"
          pdf_page: 294
          table: "Table 8-166"
          quote: "SCS0::NADBlockIndex<lane>; Condition: Page 1Ch supported"
          basis: "CMIS 5.4 expands NADBlockIndex from 4 bits (bits 3-0, bits 7-4 reserved) to the full byte, addressing the up-to-255 NAD banks of Page 1Ch (values 0..254)."
    provenance:
      section: "CMIS 5.3 § 8.17.1"
      pdf_page: 263
      table: "Table 8-156"
      quote: "SCS0::NADBlockIndex<lane>; Condition: Page 1Ch supported. Bits 7-4 are Reserved to allow future expansion."

  - name: scs1_nad_block_index
    display_name: SCS1NADBlockIndex<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "136 + (lane - 1)"
    bit_offset_expr: "0"
    bit_width: 4
    type: u4
    access: rw
    field_type: OperationalParameter
    tags: [OperationalParameter]
    scope: { lane: lane, control_set: { id: 1, kind: staged } }
    flags:
      is_required: false
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    changed_in:
      - rev: "5.4"
        bit_width: 8
        provenance:
          section: "CMIS 5.4 § 8.21.1"
          pdf_page: 294
          table: "Table 8-167"
          quote: "SCS1::NADBlockIndex<lane>; Condition: Page 1Ch supported and SCS1 supported"
          basis: "CMIS 5.4 expands NADBlockIndex from 4 bits (bits 3-0, bits 7-4 reserved) to the full byte, addressing the up-to-255 NAD banks of Page 1Ch (values 0..254)."
    provenance:
      section: "CMIS 5.3 § 8.17.1"
      pdf_page: 263
      table: "Table 8-157"
      quote: "SCS1::NADBlockIndex<lane>; Condition: Page 1Ch supported and SCS1 supported. Bits 7-4 are Reserved to allow future expansion."

