# Banked across lanes per 's bank-relative scope convention, like the
# other lane-banked pages (10h..1Fh, 61h, 62h, 6Dh). Each Bank refers to 8
# lanes (Table 8-187); the Acquisition Counter support advertisement in byte
# 130 is bank 0 only. Lane-banked pages support up to 4 banks through CMIS
# 5.3; since CMIS 5.4 they support up to 32 banks (256 lanes) via the
# BanksSupported escape code 11b (01h:142.1-0, CmisBanksSupported5p4) plus
# ExtraLaneBanksSupported (01h:174.4-0). Every field on this page is windowed
# since 5.4.
banking:
  bank_count_field: page_01h_advertising.banks_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: lane
  dimension_size: 8

