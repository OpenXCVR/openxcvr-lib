# Spec-wide field-metadata templates. VDM-specific templates land
# here first; the predefined set (threshold, telemetry_module, ...) per
# § "Predefined spec-wide templates" is a future backfill.
templates:

  # Used by every entry in Pages 20h-23h VDM Descriptor Groups
  vdm_descriptor_field:
    field_type: Informational
    tags: [Information, VDM]
    access: ro
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false

  # Used by every entry in Pages 24h-27h VDM Sample Groups (real-time values).
  # The sample's actual storage type (f16be | i16be | u16be) is dispatched per
  # polymorphic variants on the matching descriptor's observable_type;
  # this template defines only the metadata common to all samples.
  vdm_sample_field:
    field_type: Telemetry
    tags: [Monitor, VDM]
    access: ro
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true

  # Used by every entry in Pages 28h-2Bh VDM Threshold Groups (16 sets per
  # page, 4 × U16 high/low alarm + warning per set). RO at runtime; the spec
  # text describes them as factory-programmed.
  vdm_threshold_field:
    field_type: Threshold
    tags: [AlarmThreshold, AlarmThresholdValue, VDM]
    access: ro
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: true # OEM-relabel pattern (per Resolved Notes)
      is_dynamic: false

