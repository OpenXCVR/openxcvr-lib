  - name: gating_support
    display_name: GatingSupport
    offset: 129
    bit_offset: 6
    bit_width: 2
    type: u2
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags: { is_required: true, is_readable: true, is_writable: false, is_ever_writable: false, is_dynamic: false }
    enum_inline:
      - { value: 0x0, name: not_supported, description: "Gating not supported; host defines measurement time" }
      - { value: 0x1, name: accuracy_le_2_ms, description: "Gating supported with time accuracy <= 2 ms" }
      - { value: 0x2, name: accuracy_le_20_ms, description: "Gating supported with time accuracy <= 20 ms" }
      - { value: 0x3, name: accuracy_gt_20_ms, description: "Gating supported with time accuracy > 20 ms" }
    provenance:
      section: "CMIS 5.3 § 8.12.2"
      pdf_page: 225
      table: "Table 8-102"
      quote: "GatingSupport: Gating measurement over a given time interval."

