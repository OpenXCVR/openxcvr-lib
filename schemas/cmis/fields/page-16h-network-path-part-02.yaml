  - name: acs_np_in_use_lane
    display_name: ACSNPInUseLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "192 + (lane - 1)"
    bit_offset: 0
    bit_width: 1
    type: bool
    access: ro
    # CMIS 5.4 § 8.19.1 (corrigendum first published in the CMIS 5.3 Errata
    # 01.0, § 7.6.9 background): the default configuration status of the
    # ACS::NPInUseLane<i> bits shall always be initialized to zero on exit
    # from the MgmtInit state of the MSM — NP Application behavior is only
    # enabled after a configuration action of an NP-aware host.
    changed_in:
      - rev: "5.4"
        behavior:
          default_on_mgmt_init_exit: 0
        provenance:
          section: "CMIS 5.4 § 8.19.1 / § 7.6.9.3"
          pdf_page: 280
          table: "Table 8-143"
          quote: "both the default configuration of the SCS<k>::NPInUseLane<i> bits and the default configuration status of the ACS::NPInUseLane<i> bits in the NP part of the Active Control Set (ACS) shall always be initialized as zero on exit from MgmtInit state of the Module State Machine (MSM)"
    field_type: Status
    tags: [Status]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    enum_inline:
      - { value: 0, name: dp_or_unused, description: "Host lane is part of a DP Application Data Path or is unused" }
      - { value: 1, name: np_in_use, description: "Host lane is part of a Host Path feeding the Network Path identified by NPID" }
    provenance:
      section: "CMIS 5.3 § 8.15.4"
      pdf_page: 256
      table: "Table 8-142"
      quote: "ACS::NPConfigLane<i> NPInUseLane<i>: active Network Path configuration; see CMIS 5.3 § 8.15.1 Table 8-133."

