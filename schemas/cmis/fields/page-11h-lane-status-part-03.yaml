      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.4"
      pdf_page: 213
      table: "Table 8-89"
      quote: "U16 LaserBiasTx<i>: Internally measured Tx bias current monitor in 2 uA increments, times the multiplier from Table 8-52. Advertisement: 01h:160.0."

  - name: optical_power_rx
    display_name: OpticalPowerRx<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "186 + 2 * (lane - 1)"
    size_bytes: 2
    type: u16be
