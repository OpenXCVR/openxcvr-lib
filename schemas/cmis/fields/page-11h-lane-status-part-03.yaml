      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.6.1"
      pdf_page: 216
      table: "Table 8-93"
      quote: "ACS::DataPathIDLane<i>: Index of first lane in the Data Path containing lane <i>. 000b: Lane 1; 001b: Lane 2; ... 111b: Lane 8."
