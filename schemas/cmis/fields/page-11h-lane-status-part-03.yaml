  # ===========================================================================
  # § 8.10.5 Configuration Command Status (bytes 202-205) — Table 8-90
  # 4-bit per-lane status; lanes packed 2 per byte.
  # ===========================================================================

  - name: config_status_lane
    display_name: ConfigStatusLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "202 + (lane - 1) / 2"
    bit_offset_expr: "((lane - 1) % 2) * 4"
    bit_width: 4
    type: u4
    enum_ref: CmisConfigStatus
    changed_in:
      # CMIS 5.4 Table 8-101 allocates code 8h to ConfigRejectedNoEmulation
      # (DP Emulation rejection, Network Path errata incorporation M1/M2);
      # the since-5.4 code set lives in CmisConfigStatus5p4 (the in-place
      # enum keeps the pre-5.4 window, where 8h is Reserved).
      - rev: "5.4"
        enum_ref: CmisConfigStatus5p4
        provenance:
          section: "CMIS 5.4 § 8.14.5"
          pdf_page: 244
          table: "Table 8-101"
          quote: "8h ConfigRejectedNoEmulation Configuration rejected: DataPath emulation not supported"
    access: ro
    field_type: Status
    tags: [Status]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.5"
      pdf_page: 215
      table: "Table 8-90"
      quote: "Configuration Command Execution / Result Status for the Data Path of host lane <i>, during and after the most recent configuration command. See Table 8-91 for the encoding of values."

  # ===========================================================================
  # § 8.10.6 Active Control Set: Provisioned Data Path Configuration
  # (bytes 206-213) — Tables 8-92 and 8-93
  # ===========================================================================

  - name: app_sel_code_lane
    display_name: AppSelCodeLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "206 + (lane - 1)"
    bit_offset: 4
    bit_width: 4
    type: u4
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.6.1"
      pdf_page: 216
      table: "Table 8-93"
      quote: "ACS::AppSelCodeLane<i>: Defines the Application assigned to the Data Path containing lane <i>. 0000b: lane <i> is unused and unassigned (not part of a Data Path). 0001b..1111b: lane <i> is part of a Data Path for the Application described in Application Descriptor with this AppSel code."

  - name: data_path_id_lane
    display_name: DataPathIDLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "206 + (lane - 1)"
    bit_offset: 1
    bit_width: 3
    type: u3
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { lane: lane }
    flags:
