  # ===========================================================================
  # § 8.10.4 Lane-Specific Monitors (bytes 154-201) — Table 8-89
  # 16-bit per-lane telemetry, 2 bytes each. 3 monitors × 8 lanes = 48 bytes.
  # ===========================================================================

  - name: optical_power_tx
    display_name: OpticalPowerTx<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "154 + 2 * (lane - 1)"
    size_bytes: 2
    type: u16be
    encoding: { kind: scaled_unsigned, lsb_units: "0.1 uW" }
    access: ro
    field_type: Telemetry
    tags: [Monitor, "Monitor::OpticalPower"]
    scope: { lane: lane }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.4"
      pdf_page: 213
      table: "Table 8-89"
      quote: "U16 OpticalPowerTx<i>: Internally measured Tx output optical power in 0.1 uW increments, yielding a total measurement range of 0 to 6.5535 mW (~-40 to +8.2 dBm for non-zero values). Advertisement: 01h:160.1."

  - name: laser_bias_tx
    display_name: LaserBiasTx<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "170 + 2 * (lane - 1)"
    size_bytes: 2
    type: u16be
    encoding: { kind: scaled_unsigned, lsb_units: "2 uA times TxBiasCurrentScalingFactor (Page 01h:160)" }
    access: ro
    field_type: Telemetry
    tags: [Monitor, "Monitor::BiasCurrent"]
    scope: { lane: lane }
    flags:
      is_required: false
      is_readable: true
