  # ===========================================================================
  # CMIS 5.3 § 8.21 Provisioning (bytes 136-151) - Table 8-166
  # ===========================================================================

  - name: redirection_of_lane
    display_name: RedirectionOfLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "136 + (lane - 1)"
    size_bytes: 1
    type: u8
    description: "Value is the nominal host lane number j in {1..8} to which electrical host lane <lane> is redirected; values must form a permutation of {1..8}."
    access: rw
    field_type: OperationalParameter
    tags: [OperationalParameter]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    provenance:
      section: "CMIS 5.3 § 8.21"
      pdf_page: 269
      table: "Table 8-166"
      quote: "RedirectionOfLane<i> contains the nominal host lane number j in {1, ..., 8} to which the electrical host lane with lane number <i> is to be redirected."

