  - name: enable_host_lane_redirection
    display_name: EnableHostLaneRedirection
    offset: 152
    bit_offset: 0
    bit_width: 1
    type: bool
    access: rw
    field_type: Control
    tags: [Control, "Control::Configuration"]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    enum_inline:
      - { value: 0, name: disabled, description: "Commit command is without effect" }
      - { value: 1, name: enabled, description: "Commit command is effective" }
    provenance:
      section: "CMIS 5.3 § 8.21"
      pdf_page: 269
      table: "Table 8-166"
      quote: "EnableHostLaneRedirection: 0b: disabled: commit command is without effect; 1b: enabled: commit command is effective"

