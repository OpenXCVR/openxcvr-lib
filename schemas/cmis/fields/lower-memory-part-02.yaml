  # CMIS 5.4 Table 8-9: byte 8 bit 3, allocated from the 5.3 reserved bits 5-3.
  - name: abnormal_fw_indication_flag
    display_name: AbnormalFwIndicationFlag
    offset: 8
    bit_offset: 3
    bit_width: 1
    since: "5.4"
    type: bool
    access: ro
    changed_in:
      - rev: "5.4"
        read_effect: clear_on_read
        read_effect_scope: byte
        read_effect_provenance:
          source: "OIF-CMIS-05.4"
          section: "§8.1.3.6; §8.1.4.2; §8.2.4"
          table: "Table 8-3; Table 8-9"
          row: "8 bit 3 AbnormalFwIndicationFlag RO/COR Adv.; bits 5-4 Reserved"
          pdf_page: [138, 139, 172]
          access: "RO/COR"
          basis: "Table 8-3 explicitly clears all bits in a RO/COR Byte after reading, including the Reserved bits 5-4. This is a physical-byte consuming effect, not a None assertion for reserved bits. All collateral flags are consumed together and must be retained. Qualification is CMIS 5.4 only."
    behavior: { latching: clear_on_read }
    field_type: Flag
    tags: [Flag]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.4"
      pdf_page: 172
      quote: "Latched Flag indicating that the currently running Firmware content deviates from the Load identified by the active firmware version information."

