  # Monitor alarm/warning flags — bytes 9-11. Bit layout:
  #   byte 9 bits 0..7: temp high alarm, temp low alarm, temp high warn, temp low warn,
  #                     vcc high alarm, vcc low alarm, vcc high warn, vcc low warn
  #   byte 10 bits 0..7: aux1 hi-alarm, lo-alarm, hi-warn, lo-warn,
  #                      aux2 hi-alarm, lo-alarm, hi-warn, lo-warn
  #   byte 11 bits 0..3: aux3 hi-alarm, lo-alarm, hi-warn, lo-warn
  #   byte 11 bits 4..7: custom hi-alarm, lo-alarm, hi-warn, lo-warn

  - name: temp_mon_high_alarm_flag
    display_name: TempMonHighAlarmFlag
    offset: 9
    bit_offset: 0
    bit_width: 1
    type: bool
    access: ro
    behavior: { latching: clear_on_read }
    field_type: Flag
    tags: [Flag, AlarmFlag, "Monitor::Temperature"]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.4"
      pdf_page: 146
      quote: "Latched Flag for high temperature alarm."

