  # ===========================================================================
  # § 8.2.4 Module-Level Flags (bytes 8-13)
  #
  # Latched flags (read-only, clear-on-read). 5 module-status flags in byte 8,
  # then 22 monitor alarm/warning flags in bytes 9-11.
  # ===========================================================================

  - name: module_state_changed_flag
    display_name: ModuleStateChangedFlag
    offset: 8
    bit_offset: 0
    bit_width: 1
    type: bool
    access: ro
    changed_in:
      - rev: "5.3"
        read_effect: clear_on_read
        read_effect_scope: byte
        read_effect_provenance:
          source: "OIF-CMIS-05.3"
          section: "§8.1.3.6; §8.1.4.2; §8.2.4"
          table: "Table 8-3; Table 8-9"
          row: "8 bits 7,6,2,1,0 RO/COR flags; bits 5-3 Reserved"
          pdf_page: [138, 139, 146]
          access: "RO/COR"
          basis: "Table 8-3 explicitly clears all bits in a RO/COR Byte after reading, including the Reserved bits 5-3 identified by Table 8-9. This is a physical-byte consuming effect, not a None assertion for reserved bits. All collateral flags are consumed together and must be retained. Qualification is CMIS 5.3 only."
    behavior: { latching: clear_on_read }
    field_type: Flag
    tags: [Flag]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.4"
      pdf_page: 146
      quote: "Latched Flag to indicate a Module State Change."

