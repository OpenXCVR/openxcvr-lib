fields:
  - name: bank_select
    display_name: BankSelect
    offset: 126
    size_bytes: 1
    type: u8
    access: rw
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.15"
      table: "Table 8-25"
      row: "126, bits 7-0 BankSelect"
      pdf_page: 159
      access: "RW Cnd."
      basis: "§ 8.1.3.6, Table 8-3 gives RW no read side effect; only RO/COR declares clear-on-read, so reading BankSelect has no effect (§ 8.2.15 names no read behaviour for the PageMapping register)."
    field_type: Control
    tags: [Control, "Control::Configuration", "Control::BankSelect"]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    provenance:
      section: "§ 8.2.15"
      pdf_page: 159
      quote: "Bank Index of Page mapped to Upper Memory (if applicable)."

  - name: page_select
    display_name: PageSelect
    offset: 127
    size_bytes: 1
    type: u8
    access: rw
    behavior:
      latching: rw_with_state_guard
      reset_domain: management
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.15"
      table: "Table 8-25"
      row: "127, bits 7-0 PageSelect"
      pdf_page: 159
      access: "RWW Cnd."
      basis: "§ 8.1.3.6, Table 8-3 gives RWW no read side effect (RWW means the module may modify the element, not that a read does); only RO/COR declares clear-on-read, and § 8.2.15's PageMapping Validity clear happens on a host write, never on a read."
    field_type: Control
    tags: [Control, "Control::Configuration"]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    provenance:
      section: "§ 8.2.15"
      pdf_page: 159
      quote: "Page Index of Page mapped to Upper Memory."
