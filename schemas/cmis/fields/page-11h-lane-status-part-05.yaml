fields:
  - name: dp_init_pending_lane
    display_name: DPInitPendingLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset: 235
    bit_offset_expr: "lane - 1"
    bit_width: 1
    type: bool
    access: ro
    since: "5.0"
    field_type: Status
    tags: [Status]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.7"
      pdf_page: 219
      table: "Table 8-96"
      quote: "DPInitPendingLane<i>: 0b: DPInit not pending; 1b: DPInit not yet executed after successful ApplyDPInit, hence the Active Control Set content may deviate from the actual hardware configuration. When SteppedConfigOnly=0, these bits are evaluated in DPSM exit condition equations (see § 6.3.3.1)."

