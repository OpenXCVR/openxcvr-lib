  - name: extra_lane_banks_supported
    display_name: ExtraLaneBanksSupported
    offset: 174
    bit_offset: 0
    bit_width: 5
    since: "5.4"
    type: u5
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: true
      is_dynamic: false
    description: >
      The number n < 32 of non-trivially supported banks for lane-banked pages,
      indicating management register support for (n + 1) x 8 lanes. Valid only
      when 01h:142.1-0 = 11b (the 5.4 BanksSupported escape code).
    provenance:
      section: "CMIS 5.4 § 8.4.14"
      pdf_page: 207
      table: "Table 8-58"
      quote: "ExtraLaneBanksSupported: n: The number n < 32 of non-trivially supported banks for lane-banked pages, indicating management registers support for (n + 1) * 8 lanes. This field is valid only when 01h:142.1-0 = 11b"

  - name: nad_banks_supported
    display_name: NADBanksSupported
    offset: 175
    bit_offset: 0
    bit_width: 4
    type: u4
    since: "5.3"
    access: ro
    changed_in:
      - rev: "5.4"
        bit_width: 8
        provenance:
          section: "CMIS 5.4 § 8.4.15"
          pdf_page: 208
          table: "Table 8-59"
          quote: "NADBanksSupported: U8 n = number of supported NAD banks. Up to n * 15 Applications can be advertised in n groups of 15 NADs each. The maximum number of Applications that can be supported is 255 * 15 = 3825"
          basis: "The NADBanksSupported register was defined as a 4-bit field prior to CMIS revision 5.4; 5.4 expands it to the full byte 175 bits 7-0."
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: true
      is_dynamic: false
    provenance:
      section: "CMIS 5.3 § 8.4.13"
      pdf_page: 182
      quote: "Normalized Application Descriptor bank support"

