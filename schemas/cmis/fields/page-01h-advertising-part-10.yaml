      Encoded value i gives the maximum bank or page switch time as tBPC / 2^i. This is a scalar encoded advertisement, not an exponent variant.
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
