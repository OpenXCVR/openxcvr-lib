fields:

  # ===========================================================================
  # CMIS 5.4 § 8.11 Supported Pages Map (bytes 128-159) - Table 8-70
  # Bit k (0-7) of byte 128+n (0-31) set to 1 indicates the Page with Page
  # Index j = n*8+k, 0 <= j <= 255, is supported. Modeled per page index,
  # mirroring the per-instance bit decomposition of the VDM flag pages.
  # ===========================================================================

  - name: map_of_supported_pages
    display_name: MapOfSupportedPages<page_index>
    instances: { index: page_index, start: 0, end: 255 }
    offset_expr: "128 + page_index / 8"
    bit_offset_expr: "page_index % 8"
    bit_width: 1
    type: bool
    since: "5.4"
    description: "1b: the Page with Page Index <page_index> is supported; 0b: not supported."
    access: ro
    field_type: CapabilityFlag
    tags: [CapabilityFlag]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "CMIS 5.4 § 8.11"
      pdf_page: 218
      table: "Table 8-70"
      quote: "MapOfSupportedPages: U8[32] bit mask array indicating supported Pages: Bit k (0-7) in byte 128+ n (0-31) set to 1 indicates that the Page with Page Index j = n * 8+k, 0 <= j <= 255 is supported."

  # ===========================================================================
  # CMIS 5.4 § 8.11 Named Feature Advertisements (bytes 160-163) - Tables 8-71
  # and 8-72. Each named feature occupies one FeatureAdvertisement structure
  # (Table 8-71): byte 0 FeatureSupport, byte 1 bits 7-4
  # OptionsProfileCompliance and bits 3-0 RequirementsCompliance.
  # ===========================================================================

  - name: consolidated_pm_feature_support
    display_name: ConsolidatedPmFeatureSupport
    offset: 160
    size_bytes: 1
    type: u8
    since: "5.4"
    encoding: bcd
    description: "FeatureSupport byte of the ConsolidatedPmFeature FeatureAdvertisement: 0 = Consolidated Performance Monitoring feature is not supported; >0 = CmisRevision of the feature definition (U4 major, U4 minor, upper nibble major per the CmisRevision convention)."
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "CMIS 5.4 § 8.11"
      pdf_page: 218
      table: "Table 8-71 / Table 8-72"
      quote: "FeatureSupport: 0: Feature is not supported; >0: CmisRevision of the feature definition (U4 major, U4 minor)"

  - name: consolidated_pm_options_profile_compliance
    display_name: ConsolidatedPmOptionsProfileCompliance
    offset: 161
    bit_offset: 4
    bit_width: 4
    type: u4
    since: "5.4"
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags:
