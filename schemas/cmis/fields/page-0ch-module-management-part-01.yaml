      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    description: "OptionsProfileCompliance of the ConsolidatedPmFeature FeatureAdvertisement. Full compliance (3) can be advertised only when the NaSupportRegister is set to 10111100b (byte 192)."
    enum_inline:
      - { value: 0, name: undefined_unknown, description: "Undefined, unknown" }
      - { value: 1, name: noncompliant, description: "Noncompliant" }
      - { value: 2, name: partially_compliant_with_exceptions, description: "Partially compliant, with exceptions" }
      - { value: 3, name: fully_compliant, description: "Fully compliant" }
      - { value: "4..15", name: reserved, description: "Reserved" }
    provenance:
      section: "CMIS 5.4 § 8.11"
      pdf_page: 218
      table: "Table 8-71 / Table 8-72"
      quote: "OptionsProfileCompliance: 0: undefined, unknown; 1: noncompliant; 2: partially compliant, with exceptions; 3: fully compliant"

