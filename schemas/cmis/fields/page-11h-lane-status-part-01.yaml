fields:

  # ===========================================================================
  # § 8.10.1 Data Path States (bytes 128-131) — Table 8-83
  # 4-bit per-lane state; lanes packed 2 per byte (lane (2k-1) low, 2k high).
  # ===========================================================================

  - name: dp_state_host_lane
    display_name: DPStateHostLane<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset_expr: "128 + (lane - 1) / 2"
    bit_offset_expr: "((lane - 1) % 2) * 4"
    bit_width: 4
    type: u4
    enum_ref: CmisDataPathState
    access: ro
    field_type: Status
    tags: [Status]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.10.1"
      pdf_page: 208
      table: "Table 8-83"
      quote: "Data Path State of host lane <i> (see Table 8-84)."

