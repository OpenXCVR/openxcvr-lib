    bit_width: 1
    type: bool
    access: ro
    since: "5.0"
    field_type: Status
    tags: [Status]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    enum_inline:
      - { value: 0, name: invalid_or_muted, description: "Rx output signal invalid or muted" }
      - { value: 1, name: valid, description: "Rx output signal valid" }
    provenance:
      section: "§ 8.10.2"
      pdf_page: 209
      table: "Table 8-85"
      quote: "OutputStatusRx<i>: 0b: Rx<i> output signal invalid or muted; 1b: Rx<i> output signal valid."

