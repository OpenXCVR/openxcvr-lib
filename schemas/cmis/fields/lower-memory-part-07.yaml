  # ===========================================================================
  # § 8.2.8 CDB Command Status (bytes 37-38)
  # ===========================================================================

  - name: cdb_status_1
    display_name: CdbStatus1
    offset: 37
    size_bytes: 1
    type: composite
    composite_ref: CmisCdbStatus
    access: ro
    changed_in:
      - rev: "5.3"
        read_effect: none
        read_effect_provenance:
          source: "OIF-CMIS-05.3"
          section: "§8.1.3.6; §8.2.8"
          table: "Table 8-3; Table 8-13; Table 8-14"
          row: "37 CdbStatus1 bits 7-0"
          pdf_page: [138, 151]
          access: "RO Adv."
          basis: "Table 8-13 defines the entire physical byte as plain RO status, not RO/COR (Table 8-3). Section 8.2.8 permits polling the current status during background execution; reading has no specified action. Table 8-14 covers busy, failed and result bits. The module updates this status: change source stays Dynamic, never Static. Qualification is CMIS 5.3 only."
    field_type: Status
    tags: [Status]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.8"
      pdf_page: 151
      table: "Table 8-14"
      quote: "Status of the most recent CDB command in CDB instance 1."

  - name: cdb_status_2
    display_name: CdbStatus2
    offset: 38
    size_bytes: 1
    type: composite
