  - name: module_active_firmware_major_revision
    display_name: ModuleActiveFirmwareMajorRevision
    offset: 39
    size_bytes: 1
    since: "4.0"
    type: u8
    access: ro
    changed_in:
      - rev: "5.3"
        read_effect: none
        read_effect_provenance:
          source: "OIF-CMIS-05.3"
          section: "§8.2.9"
          table: "Table 8-15"
          row: "39 ModuleActiveFirmwareMajorRevision bits 7-0"
          pdf_page: 153
          access: "RO Rqd."
          basis: "Table 8-15 defines the entire physical byte as plain RO firmware revision information, with no read-triggered action. Qualification is CMIS 5.3 only."
    field_type: Informational
    tags: [Information]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "§ 8.2.9"
