fields:

  # ===========================================================================
  # § 8.2.1 Management Characteristics (bytes 0-2)
  # ===========================================================================

  - name: sff8024_identifier
    display_name: SFF8024Identifier
    offset: 0
    size_bytes: 1
    type: enum_ref
    enum_ref: Sff8024Identifier
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.1"
      table: "Table 8-5"
      row: "0, bits 7-0 SFF8024Identifier"
      pdf_page: 142
      access: "RO Rqd."
      basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    field_type: Informational
    tags: [Information]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: true
      is_dynamic: false
    provenance:
      section: "§ 8.2.1"
      pdf_page: 142
      quote: "SFF8024Identifier is an SFF-8024 module type Identifier from Table 4-1 in [5] which allows to infer both physical form factor and management protocol of the module."

  - name: cmis_revision
    display_name: CmisRevision
    offset: 1
    size_bytes: 1
    type: u8
    encoding: bcd
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.1"
      table: "Table 8-5"
      row: "1, bits 7-0 CmisRevision"
      pdf_page: 142
      access: "RO Rqd."
      basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    field_type: Informational
    tags: [Information]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: true
      is_dynamic: false
    provenance:
      section: "§ 8.2.1"
      pdf_page: 142
      quote: "CMIS revision number (decimal): The upper nibble (bits 7-4) is the integer part (major number), the lower nibble (bits 3-0) is the decimal part (minor number)."

  - name: memory_model
    display_name: MemoryModel
    offset: 2
    bit_offset: 7
    bit_width: 1
    type: bool
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.1"
      table: "Table 8-5"
      row: "2, bit 7 MemoryModel"
      pdf_page: 142
      access: "RO Rqd."
      basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    changed_in:
      - rev: "4.0"
        read_effect: none
        read_effect_provenance:
          source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
          section: "§8.2.1"
          table: "Table 8-2"
          row: "2 bit 7 Flat_mem"
          pdf_page: [83]
          basis: "Flat_mem is RO RQD, a static memory-model characteristic, with no read-triggered action."
      - rev: "5.0"
        read_effect: none
        read_effect_provenance:
          source: "OIF-CMIS-05.3"
          section: "§ 8.2.1"
          table: "Table 8-5"
          row: "2, bit 7 MemoryModel"
          pdf_page: 142
          access: "RO Rqd."
          basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    field_type: CapabilityFlag
    tags: [CapabilityFlag]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    enum_inline:
      - { value: 0, name: paged, description: "Paged memory (Pages 00h-02h, 10h-11h supported)" }
      - { value: 1, name: flat, description: "Flat memory (Page 00h supported only)" }
    provenance:
      section: "§ 8.2.1"
      pdf_page: 142
      quote: "Indicator of the memory model of the module: 0b: Paged memory (Pages 00h-02h, 10h-11h supported); 1b: Flat memory (Page 00h supported only)."

  - name: reserved_management_bit6_cmis4
    display_name: ReservedManagementBit6Cmis4
    offset: 2
    bit_offset: 6
    bit_width: 1
    since: "4.0"
    until: "5.0"
    type: bitmap
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
      section: "§8.2.1; §8.1.3.2; §3.1"
      table: "Table 8-2"
      row: "2 bit 6 Reserved"
      pdf_page: [18, 80, 83]
      basis: "§8.1.3.2 includes reserved bits: zero-initialized with no other module obligations; §3.1 says hosts do not evaluate them. No read-triggered action is assigned."
    field_type: Reserved
    tags: [Reserved]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false

  - name: reserved_management_bits5_4_cmis4
    display_name: ReservedManagementBits5To4Cmis4
    offset: 2
    bit_offset: 4
    bit_width: 2
    since: "4.0"
    until: "5.0"
    type: bitmap
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
      section: "§8.2.1; §8.1.3.2; §3.1"
      table: "Table 8-2"
      row: "2 bits 5:4 Reserved"
      pdf_page: [18, 80, 83]
      basis: "§8.1.3.2 includes reserved bits: zero-initialized with no other module obligations; §3.1 says hosts do not evaluate them. No read-triggered action is assigned."
    field_type: Reserved
    tags: [Reserved]
    scope: { module: true }
    flags:
