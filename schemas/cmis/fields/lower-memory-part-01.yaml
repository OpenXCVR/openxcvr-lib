    read_effect: none
    read_effect_provenance:
      source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
      section: "§8.2.1; §8.1.3.2; §3.1"
      table: "Table 8-2"
      row: "2 bits 1:0 Reserved"
      pdf_page: [18, 80, 83]
      basis: "§8.1.3.2 includes reserved bits: zero-initialized with no other module obligations; §3.1 says hosts do not evaluate them. No read-triggered action is assigned."
    field_type: Reserved
    tags: [Reserved]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false

  - name: stepped_config_only
    display_name: SteppedConfigOnly
    offset: 2
    bit_offset: 6
    bit_width: 1
    since: "5.0"
    type: bool
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.1"
      table: "Table 8-5"
      row: "2, bit 6 SteppedConfigOnly (shared byte-2 Type cell)"
      pdf_page: 142
      access: "RO Rqd."
      basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    field_type: CapabilityFlag
    tags: [CapabilityFlag]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "§ 8.2.1"
      pdf_page: 142
      quote: "Indicates which reconfiguration procedures are supported: 0b: Module supports all types of reconfigurations; 1b: Module supports the essential step-by-step reconfiguration but none or only one of the two intervention-free reconfiguration types."

  - name: mci_max_speed
    display_name: MciMaxSpeed
    offset: 2
    bit_offset: 2
    bit_width: 4
    type: u4
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.1"
      table: "Table 8-5"
      row: "2, bits 5-2 MciMaxSpeed (shared byte-2 Type cell, pp. 142-143)"
      pdf_page: 143
      access: "RO Rqd."
      basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    aliased_to:
      - { rev: "4.0", new_name: twi_max_speed_cmis4 }
      - { rev: "5.0", new_name: mci_max_speed }
    changed_in:
      - rev: "3.0"
        type: u2
        bit_width: 2
        enum_inline:
          - { value: 0, name: i2c_400khz, description: "Module supports up to 400 kHz" }
          - { value: 1, name: i2c_1mhz, description: "Module supports up to 1 MHz" }
          - { value: 2..3, name: reserved_2_3, description: "Reserved" }
        provenance:
          section: "§ 1.7.2.1 ID and Status"
          table: "Table 18"
          pdf_page: 49
          printed_page: 47
          quote: "TWI Maximum speed: bits 3-2. 00b=Module supports up to 400 kHz; 01b=Module supports up to 1 MHz; 10b=Reserved; 11b=Reserved."
      - rev: "4.0"
        type: u2
        bit_width: 2
        enum_inline:
          - { value: 0, name: i2c_400khz, description: "Module supports up to 400 kHz" }
          - { value: 1, name: i2c_1mhz, description: "Module supports up to 1 MHz" }
          - { value: 2..3, name: reserved_2_3, description: "Reserved" }
        provenance:
          section: "§8.2.1"
          table: "Table 8-2"
          pdf_page: 83
          quote: "TWI Maximum speed: bits 3-2. 00b up to 400 kHz; 01b up to 1 MHz; 10b and 11b Reserved."
        read_effect: none
        read_effect_provenance:
          source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
          section: "§8.2.1; §8.1.3.2; §3.1"
          table: "Table 8-2"
          row: "2 bits 3:2 TWI Maximum speed"
          pdf_page: [18, 80, 83]
          basis: "TWI Maximum speed is RO RQD and static: 00 up to 400 kHz, 01 up to 1 MHz, 10 and 11 Reserved. No read-triggered action is assigned."
      - rev: "5.0"
        type: u2
        bit_width: 2
        enum_inline:
          - { value: 0, name: i2c_400khz, description: "Module supports up to 400 kHz" }
          - { value: 1, name: i2c_1mhz, description: "Module supports up to 1 MHz" }
          - { value: 2..3, name: reserved_2_3, description: "Reserved" }
        provenance:
          section: "§ 8.2.1"
          table: "Table 8-4"
          pdf_page: 108
          quote: "MciMaxSpeed: bits 3-2. 00b: Module supports up to 400 kHz; 01b: Module supports up to 1 MHz; 10b: Reserved; 11b: Reserved."
        read_effect: unknown
        read_effect_provenance: null
      - rev: "5.3"
        type: u4
        bit_width: 4
        enum_inline:
          - { value: 0, name: i2c_400khz, description: "Module supports up to 400 kHz" }
          - { value: 1, name: i2c_1mhz, description: "Module supports up to 1 MHz" }
          - { value: 2, name: i2c_3p4mhz, description: "Module supports up to 3.4 MHz" }
          - { value: 0x3..0xf, name: reserved_3_f, description: "Reserved" }
        provenance:
          section: "§ 8.2.1"
          table: "Table 8-5"
          pdf_page: 143
          quote: "Indicates maximum supported clock speed of Management Communication Interface (MCI). I2CMCI: 0: up to 400 kHz; 1: up to 1 MHz; 2: up to 3.4 MHz; 3-15: Reserved."
        read_effect: none
        read_effect_provenance:
          source: "OIF-CMIS-05.3"
          section: "§ 8.2.1"
          table: "Table 8-5"
          row: "2, bits 5-2 MciMaxSpeed (shared byte-2 Type cell, pp. 142-143)"
          pdf_page: 143
          access: "RO Rqd."
          basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    enum_inline:
      - { value: 0, name: i2c_400khz, description: "Module supports up to 400 kHz" }
      - { value: 1, name: i2c_1mhz, description: "Module supports up to 1 MHz" }
      - { value: 2, name: i2c_3p4mhz, description: "Module supports up to 3.4 MHz" }
      - { value: 0x3..0xf, name: reserved_3_f, description: "Reserved" }
    provenance:
      section: "§ 8.2.1"
      pdf_page: 143
      quote: "Indicates maximum supported clock speed of Management Communication Interface (MCI). I2CMCI: 0: up to 400 kHz; 1: up to 1 MHz; 2: up to 3.4 MHz; 3-15: Reserved."

  - name: auto_commissioning
    display_name: AutoCommissioning
    offset: 2
    bit_offset: 0
    bit_width: 2
    since: "5.3"
    type: u2
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§ 8.2.1"
      table: "Table 8-5"
      row: "2, bits 1-0 AutoCommissioning (shared byte-2 Type cell, pp. 142-143)"
      pdf_page: 143
      access: "RO Rqd."
      basis: "§ 8.1.3.6, Table 8-3 distinguishes plain RO from RO/COR side effects."
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "§ 8.2.1"
      pdf_page: 143
      quote: "This field allows modules to support just one of the two intervention-free reconfiguration procedures, either the regular (automatic DPSM state changing) one or the hot one (staying in DPSM state)."

  # ===========================================================================
  # § 8.2.2 Global Status Information (byte 3)
  # ===========================================================================

  # Internal D4 addition: authority is CMIS 4.0 only, not inherited by 5.x.
  - name: reserved_module_status_cmis4
    display_name: ReservedModuleStatusCmis4
    offset: 3
    bit_offset: 4
    bit_width: 4
    since: "4.0"
    until: "5.0"
    type: bitmap
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
      section: "§8.1.3.2; §8.2.1"
      table: "Table 8-2"
      pdf_page: [80, 83]
      basis: "Byte 3 bits 7:4 are Reserved. Reserved locations explicitly include bits; they are zero-initialized with no other module obligations. Hosts do not evaluate them (§3.1, PDF p.18). No read-triggered action is assigned."
    field_type: Reserved
    tags: [Reserved]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false

  # CMIS 5.3 byte-3 qualification; Reserved bits are not interpreted.
  - name: reserved_module_status_cmis53
    display_name: ReservedModuleStatusCmis53
    offset: 3
    bit_offset: 4
    bit_width: 4
    since: "5.3"
    type: bitmap
    emit_value: false
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3 (September 4, 2024)"
      section: "§8.1.3.1; §8.1.3.6; §8.2.2"
      table: "Table 8-3; Table 8-6"
      pdf_page: [137, 138, 144]
      basis: "Byte 3 bits 7:4 are Reserved in the RO global-status byte. Reserved bits within accessible pages are accessible without associated functionality; neither host nor module evaluates their data. Together with the RO status fields, this qualifies this byte, not RO fields universally."
    field_type: Reserved
    tags: [Reserved]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false

  - name: module_state
    display_name: ModuleState
    offset: 3
    bit_offset: 1
    bit_width: 3
    type: u3
    enum_ref: CmisModuleState
    access: ro
    changed_in:
      - rev: "4.0"
        read_effect: none
        read_effect_provenance:
          source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
          section: "§8.2.1; §8.2.3; §6.3.1.7-§6.3.1.10"
          table: "Table 8-2; Table 8-3; Table 8-5"
          pdf_page: [52, 53, 83, 85]
          basis: "Byte 3 bits 3:1 Module state and bit 0 Interrupt share RO RQD. These report current state/signal, not latched flags. Interrupt remains asserted until underlying flags are read; clear-on-read is assigned to the flag registers (bytes 8-11), not byte 3."
      - rev: "5.0"
        read_effect: unknown
        read_effect_provenance: null
      - rev: "5.3"
        read_effect: none
        read_effect_provenance:
          source: "OIF-CMIS-05.3 (September 4, 2024)"
          section: "§8.1.3.1; §8.1.3.6; §8.2.2"
          table: "Table 8-3; Table 8-6"
          pdf_page: [137, 138, 144]
          basis: "Table 8-6 assigns RO to the whole byte-3 global-status information: Reserved bits 7:4, ModuleState bits 3:1 and InterruptDeasserted bit 0. Table 8-3 distinguishes RO from RO/COR; accessible Reserved bits have no associated functionality. This specific byte has no read-triggered action; current status remains dynamic."
    field_type: Status
    tags: [Status]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.2"
      pdf_page: 144
      table: "Table 8-7"
      quote: "Current Module State (see Table 8-7 for encoding and section 6.3.2 for a description of the meaning of ModuleState)."

  - name: interrupt_deasserted
    display_name: InterruptDeasserted
    offset: 3
    bit_offset: 0
    bit_width: 1
    type: bool
    access: ro
    changed_in:
      - rev: "4.0"
        read_effect: none
        read_effect_provenance:
          source: "CMIS 4.0 (CMIS4p0_Third_Party_Spec)"
          section: "§8.2.1; §8.2.3; §6.3.1.7-§6.3.1.10"
          table: "Table 8-2; Table 8-3; Table 8-5"
          pdf_page: [52, 53, 83, 85]
          basis: "Byte 3 bits 3:1 Module state and bit 0 Interrupt share RO RQD. These report current state/signal, not latched flags. Interrupt remains asserted until underlying flags are read; clear-on-read is assigned to the flag registers (bytes 8-11), not byte 3."
      - rev: "5.0"
        read_effect: unknown
        read_effect_provenance: null
      - rev: "5.3"
        read_effect: none
        read_effect_provenance:
          source: "OIF-CMIS-05.3 (September 4, 2024)"
          section: "§8.1.3.1; §8.1.3.6; §8.2.2"
          table: "Table 8-3; Table 8-6"
          pdf_page: [137, 138, 144]
          basis: "Table 8-6 assigns RO to the whole byte-3 global-status information: Reserved bits 7:4, ModuleState bits 3:1 and InterruptDeasserted bit 0. Table 8-3 distinguishes RO from RO/COR; accessible Reserved bits have no associated functionality. This specific byte has no read-triggered action; current status remains dynamic."
    field_type: Status
    tags: [Status]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    enum_inline:
      - { value: 0, name: asserted, description: "Interrupt asserted" }
      - { value: 1, name: not_asserted, description: "Interrupt not asserted (default)" }
    provenance:
      section: "§ 8.2.2"
      pdf_page: 144
      quote: "Status of Interrupt output signal. 1b: Interrupt not asserted (default); 0b: Interrupt asserted."

  # ===========================================================================
  # § 8.2.3 Flags Summary (bytes 4-7)
  #
  # Per-bank (0..3) summary bits for upper-pages-with-flags. Collapsed by bank
  # (offset_expr "4 + bank") since the (bank, page) → (byte, bit) layout has a
  # clean linear formula. § "Collapsed-array schema entries" rule
  # applies: same metadata, only linear offset varies.
  # ===========================================================================

  - name: flags_summary_page_11h
    display_name: FlagsSummaryBank<bank>Page11h
    instances: { index: bank, start: 0, end: 3 }
    offset_expr: "4 + bank"
    bit_offset: 0
    bit_width: 1
    type: bool
    access: ro
    field_type: Status
    tags: [Status, Flag]
    scope: { module: true }
    flags:
      is_required: true   # only Page11h is Rqd. per Table 8-8; others are Adv.
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.3"
      pdf_page: 145
      table: "Table 8-8"
      quote: "1b: at least one Flag is set on Bank <bank>, Page 11h."

  - name: flags_summary_page_12h
    display_name: FlagsSummaryBank<bank>Page12h
    instances: { index: bank, start: 0, end: 3 }
    offset_expr: "4 + bank"
    bit_offset: 1
    bit_width: 1
    type: bool
    access: ro
    field_type: Status
    tags: [Status, Flag]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: true
    provenance:
      section: "§ 8.2.3"
      pdf_page: 145
      table: "Table 8-8"
      quote: "1b: at least one Flag is set on Bank <bank>, Page 12h."
