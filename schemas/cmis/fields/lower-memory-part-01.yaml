      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false

  - name: reserved_management_bits1_0_cmis4
    display_name: ReservedManagementBits1To0Cmis4
    offset: 2
    bit_offset: 0
    bit_width: 2
