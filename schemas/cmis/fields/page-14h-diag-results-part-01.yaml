fields:

  # ===========================================================================
  # § 8.13.1 Diagnostics Selection (byte 128) — Tables 8-126 and 8-127
  # ===========================================================================

  - name: diagnostics_selector
    display_name: DiagnosticsSelector
    offset: 128
    size_bytes: 1
    type: enum_ref
    since: "4.0"  # exists from CMIS 4.0 § 8.11 (Tables 8-92/8-94, printed pp. 179-184)
    enum_ref: CmisDiagnosticsSelector
    access: rw
    behavior:
      unsupported_value: reverts_to_zero
      content_switch_time: tDDCS
    # Stage 1 B2: this selector multiplexes the content of the Diagnostics
    # Data window (bytes 192-255). The settling bound is revision-qualified:
    # CMIS 4.0 § 8.11.1 (printed p. 179) — "The values in bytes 192-255
    # shall be updated with the selected diagnostic data within the
    # advertised tNACK time after byte 128 has been written"; CMIS 5.0+
    # (CMIS 5.3 § 8.13.1, printed p. 244, and Table 10-5, printed p. 353) —
    # a pure timing specification with no completion confirmation, so the
    # host waits a tDDCS guard period (at most 10 ms from WRITE STOP to
    # READ START).
    content_switch:
      data_range: [192, 255]
      bound:
        - since: "4.0"
          settling: tnack_advertised
          provenance: "CMIS 4.0 § 8.11.1 (printed p. 179)"
        - since: "5.0"
          settling: tddcs
          provenance: "CMIS 5.3 § 8.13.1 and Table 10-5 (printed pp. 244, 353)"
    field_type: Control
    tags: [Control, "Control::Configuration"]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    provenance:
      section: "CMIS 5.3 § 8.13.1"
      pdf_page: 244
      table: "Table 8-126"
      quote: "DiagnosticsSelector: Select content of Diagnostics Data, see Table 8-127. Reverts to 0 if value not supported."

  - name: custom_diagnostics_selection
    display_name: CustomDiagnosticsSelection
    offset: 130
    size_bytes: 2
    type: bytes
    since: "4.0"  # exists from CMIS 4.0 § 8.11 (Tables 8-92/8-94, printed pp. 179-184)
    access: rw
    field_type: VendorSpecific
    tags: [VendorSpecific]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    provenance:
      section: "CMIS 5.3 § 8.13.1"
      pdf_page: 244
      table: "Table 8-126"
      quote: "Bytes 130-131 are Custom[2]."

