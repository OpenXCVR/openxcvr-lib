  # ===========================================================================
  # § 8.2.13 Applications Advertising (bytes 85-117)
  #
  # MediaType discriminator at byte 85 followed by 8 Application Descriptors,
  # 4 bytes each starting at byte 86. Per-app fields collapse to 6 entries
  # using 's `instances:` mechanism.
  #
  # MediaType is the discriminator that selects which SFF-8024 media table
  # MediaInterfaceID values come from. Polymorphic-variant resolution (per
  #) applies at L2 — adapter dispatches MediaInterfaceID lookup
  # based on MediaType.
  # ===========================================================================

  - name: media_type
    display_name: MediaType
    offset: 85
    size_bytes: 1
    type: u8
    enum_ref: CmisMediaType
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§8.2.13"
      table: "Table 8-21"
      row: "85 bits 7:0 Module Type Encoding / MediaType"
      pdf_page: [157]
      basis: "§8.2.13 describes supported-application advertising, with plain RO (not RO/COR) access in the cited table. These are static interface capabilities, not status or controls; no read-triggered action is assigned."
