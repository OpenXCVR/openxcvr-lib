      section: "§ 8.2.13"
      pdf_page: 157
      quote: "HostInterfaceID ID from [5] or FFh to mark as unused (empty Application Descriptor)."

  - name: media_interface_id_app
    display_name: MediaInterfaceIDApp<app>
    instances: { index: app, start: 1, end: 8 }
    offset_expr: "87 + 4 * (app - 1)"
    size_bytes: 1
    type: u8
    # The interpretation of this byte is polymorphic on `media_type`:
    # see (variants:) — adapter dispatches the SFF-8024 media-table
    # lookup based on MediaType. Schema-side variant boundaries:
    variants:
      discriminator: { field: media_type }
      cases:
        - when: { value: 0x01 }   # Optical interfaces (MMF)
          enum_ref: Sff8024MmfMediaInterface
        - when: { value: 0x02 }   # Optical interfaces (SMF)
          enum_ref: Sff8024SmfMediaInterface
        - when: { value: 0x03 }   # Passive copper cable
          enum_ref: Sff8024PassiveCableCodes
        - when: { value: 0x04 }   # Active copper cable
          enum_ref: Sff8024ActiveCableCodes
        - when: { value: 0x05 }   # BASE-T
          enum_ref: Sff8024BaseTCodes
    access: ro
    read_effect: none
    read_effect_provenance:
      source: "OIF-CMIS-05.3"
      section: "§8.2.13"
      table: "Table 8-23"
      row: "87 + 4*(app-1), bits 7:0 Module Media Interface ID / MediaInterfaceID, app 1..8"
      pdf_page: [157, 158]
