          basis: "§8.2.13 describes supported-application advertising, with plain RO (not RO/COR) access in the cited table. These are static interface capabilities, not status or controls; no read-triggered action is assigned."
      # CMIS 5.4 Table 8-22 designates ID BEh as the escape code for the 12-bit
      # interface UID: BEh means the Host Interface GID is non-zero and the
      # corresponding NAD (Page 1Ch) must be consulted. The ID BEh is not
      # associated with any SFF-8024 standard.
      - rev: "5.4"
        behavior:
          gid_escape_code: 0xBE
          on_escape: "the GID of the Host Interface UID is non-zero; consult the NAD (Page 1Ch) for the 12-bit Host Interface UID"
        provenance:
          section: "CMIS 5.4 § 8.2.13"
          table: "Table 8-22"
          pdf_page: 183
          quote: "BEh: the GID of the Host Interface UID is non-zero and hence the corresponding NAD must be consulted. Note: The ID BEh is not associated with any standard."
