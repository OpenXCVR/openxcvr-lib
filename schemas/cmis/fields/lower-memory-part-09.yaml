      # CMIS 5.4 Table 8-22 designates ID BEh as the escape code for the 12-bit
      # interface UID: BEh means the Media Interface GID is non-zero and the
      # corresponding NAD (Page 1Ch) must be consulted. The ID BEh is not
      # associated with any SFF-8024 standard.
      - rev: "5.4"
        behavior:
          gid_escape_code: 0xBE
          on_escape: "the corresponding NAD must be consulted because of non-zero MediaInterfaceGID"
        provenance:
          section: "CMIS 5.4 § 8.2.13"
          table: "Table 8-22"
          pdf_page: 183
          quote: "BEh: the corresponding NAD must be consulted because of non-zero MediaInterfaceGID. Note: The ID BEh is not associated with any standard."
