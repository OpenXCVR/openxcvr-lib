fields:

  # ===========================================================================
  # CMIS 5.4 § 8.30.1 Host Lane Polarity Inversion Indication (bytes 128-129)
  # - Table 8-188. Lane 1 is bit 0 of its byte. Implementations supporting
  # Page 60h must duplicate the advertised polarity inversion information
  # from Page 01h § 8.4.13 onto bank 0 of Page 60h; this status indication
  # reflects the actual polarity (also for programmable lane polarity).
  # ===========================================================================

  - name: input_polarity_status_tx
    display_name: InputPolarityStatusTx<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset: 128
    bit_offset_expr: "lane - 1"
    bit_width: 1
    type: bool
    since: "5.4"
    description: "0b: Module input lane <lane> polarity is regular; 1b: Module input lane <lane> polarity is inverted. For inverted input lane polarity of the module, the host needs to invert its output lane polarity setting, too."
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "CMIS 5.4 § 8.30.1"
      pdf_page: 313
      table: "Table 8-188"
      quote: "InputPolarityStatusTx<i>: 0b: Module input lane <i> polarity is regular; 1b: Module input lane <i> polarity is inverted"

  - name: output_polarity_status_rx
    display_name: OutputPolarityStatusRx<lane>
    instances: { index: lane, start: 1, end: 8 }
    offset: 129
    bit_offset_expr: "lane - 1"
    bit_width: 1
    type: bool
    since: "5.4"
    description: "0b: Module output lane <lane> polarity is regular; 1b: Module output lane <lane> polarity is inverted. For inverted output lane polarity of the module, the host needs to invert its input lane polarity setting, too."
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { lane: lane }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "CMIS 5.4 § 8.30.1"
      pdf_page: 313
      table: "Table 8-188"
      quote: "OutputPolarityStatusRx<i>: 0b: Module output lane <i> polarity is regular; 1b: Module output lane <i> polarity is inverted"

  # ===========================================================================
