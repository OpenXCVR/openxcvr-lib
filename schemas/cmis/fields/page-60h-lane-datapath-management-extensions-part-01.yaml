  # ===========================================================================
  # CMIS 5.4 § 8.30 Counter Resets (bytes 192-195) - Table 8-189. Supported
  # when advertised in 60h:130.7-4. Table 8-189 prints the byte address of
  # the last two rows as 195 twice; per the byte ordering of the table
  # (Rx before Tx, matching rows 192/193) byte 194 is
  # ResetDpAcquisitionCountersRx and byte 195 is ResetDpAcquisitionCountersTx.
  # ===========================================================================

  - name: reset_acquisition_counters_rx
    display_name: ResetAcquisitionCountersRx
    offset: 192
    size_bytes: 1
    type: bitmap
    since: "5.4"
    description: "Bit mask. Writing a value with bit k set, 0 <= k <= 7, resets the acquisition counter for media lane number k+1."
    access: wo
    field_type: Control
    tags: [Control, WriteTrigger]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: false
      is_writable: true
      is_ever_writable: true
      is_dynamic: false
    provenance:
      section: "CMIS 5.4 § 8.30"
      pdf_page: 313
      table: "Table 8-189"
      quote: "ResetAcquisitionCountersRx: Bit mask. Writing a value with bit k set, where 0 <= k <= 7, resets the acquisition counter for media lane number k+1."

  - name: reset_acquisition_counters_tx
    display_name: ResetAcquisitionCountersTx
