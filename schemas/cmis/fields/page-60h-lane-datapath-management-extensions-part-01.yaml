  # 0 only) - Table 8-188. Each bit refers to one of the four acquisition
  # counter categories found on Page 61h.
  # ===========================================================================

  - name: acq_counters_rx_supported
    display_name: AcqCountersRxSupported
    offset: 130
    bit_offset: 7
    bit_width: 1
    type: bool
    since: "5.4"
    description: "1b: the AcquisitionCounterRx category on Page 61h is supported; 0b: not supported."
    access: ro
    field_type: CapabilityFlag
    tags: [CapabilityFlag]
    scope: { module: true }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      section: "CMIS 5.4 § 8.30"
      pdf_page: 313
      table: "Table 8-188"
      quote: "AcqCountersRxSupported: Referring to the four acquisition counter categories found on Page 61h: 0b: Acquisition counter category is not supported; 1b: Acquisition counter category is supported"

