    bit_width: 2
    type: u2
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CapabilityAdvertisement]
    scope: { module: true }
    flags: { is_required: true, is_readable: true, is_writable: false, is_ever_writable: false, is_dynamic: false }
    enum_inline:
      - { value: 0x0, name: not_supported, description: "Recovered clock not supported for contra-directional pattern generator" }
