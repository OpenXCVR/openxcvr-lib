      - { value: 0x2, name: supported_with_loopback, description: "Supported with loopback" }
      - { value: 0x3, name: supported_with_and_without_loopback, description: "Supported with and without loopback" }
    provenance: { section: "CMIS 5.3 § 8.12.5", pdf_page: 229, table: "Table 8-108", quote: "Options to use recovered clock for contra-directional pattern generator on the same module side." }

