schema: openxcvr.page.v1
kind: page
id: CmisPage1DhHostLaneSwitching
title: CMIS Page 1Dh Host Lane Switching (banked)
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 8.21
  pdf_pages: [268, 269, 270]
page_address: "1Dh"
size_bytes: 128
present_when: "page_01h_advertising.host_lane_switching_supported == true"

# Banked across lanes per 's bank-relative scope convention. Each
# supported Bank provides host lane switching functionality for 8 lanes.
# CMIS 5.4 § 4.1.1 / § 8.1.2 expands lane banking to up to 32 banks
# (256 lanes): BanksSupported = 11b (01h:142.1-0, CmisBanksSupported5p4)
# is the escape code and 01h:174.4-0 ExtraLaneBanksSupported carries the
# extra bank count. Through CMIS 5.3 the maximum is 4 banks (32 lanes).
banking:
  bank_count_field: page_01h_advertising.banks_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: lane
  dimension_size: 8

field_includes:
  - fields/page-1dh-host-lane-switching-part-01.yaml
  - fields/page-1dh-host-lane-switching-part-02.yaml
fields: []
