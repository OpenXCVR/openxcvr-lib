id: CmisPage12hTunableLaser
title: CMIS Page 12h Tunable Laser Control and Status (banked)
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 8.11
  pdf_pages: [221, 222]
page_address: "12h"
size_bytes: 128

# Banked across media lanes (8 per bank) per 's bank-relative scope.
# Module advertises Page 12h support via Page 01h:155.6 (TunableLaserSupported).
# Note: Page 12h has no Page Checksum byte (per spec, byte 255 is reserved).
# CMIS 5.4 § 4.1.1 / § 8.1.2 expands lane banking to up to 32 banks
# (256 lanes): BanksSupported = 11b (01h:142.1-0, CmisBanksSupported5p4)
# is the escape code and 01h:174.4-0 ExtraLaneBanksSupported carries the
# extra bank count. Through CMIS 5.3 the maximum is 4 banks (32 lanes).
banking:
  bank_count_field: page_01h_advertising.banks_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: lane
  dimension_size: 8

field_includes:
