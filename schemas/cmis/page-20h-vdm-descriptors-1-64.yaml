schema: openxcvr.page.v2
kind: page
id: CmisPage20hVdmDescriptors1To64
title: CMIS Page 20h VDM Descriptors 1-64
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 8.22.1
  pdf_pages: [271, 272, 273, 274]
page_address: "20h"
size_bytes: 128
present_when: "page_2fh_vdm_advertisement.vdm_support >= 0"

# VDM group 1 is implicit in the page address. This page is not bank-multiplexed;
# additional VDM groups use distinct page addresses 21h-23h.
fields:
  - name: local_threshold_set_id
    display_name: LocalThresholdSetIDVDM<vdm_instance>
    since: "4.0"
    instances: { index: vdm_instance, start: 1, end: 64 }
    offset_expr: "128 + 2 * (vdm_instance - 1)"
    bit_offset: 4
    bit_width: 4
    type: u4
    template: vdm_descriptor_field
    scope: { vdm_instance: vdm_instance }
    behavior:
      global_threshold_set_id_formula: "1 + local_threshold_set_id"
    provenance:
      section: "CMIS 5.3 § 8.22.1.1"
      pdf_page: 273
      table: "Table 8-169"
      quote: "ThresholdSetID = 1 + LocalThresholdSetID"

  - name: monitored_resource
    display_name: MonitoredResourceVDM<vdm_instance>
    since: "4.0"
    instances: { index: vdm_instance, start: 1, end: 64 }
    offset_expr: "128 + 2 * (vdm_instance - 1)"
    bit_offset: 0
    bit_width: 4
    type: u4
    template: vdm_descriptor_field
    scope: { vdm_instance: vdm_instance }
    enum_inline:
      - { value: 0x0, name: lane_1_or_data_path_starting_lane_1, description: "Lane 1 or Data Path starting on lane 1" }
      - { value: 0x1, name: lane_2_or_data_path_starting_lane_2, description: "Lane 2 or Data Path starting on lane 2" }
      - { value: 0x2, name: lane_3_or_data_path_starting_lane_3, description: "Lane 3 or Data Path starting on lane 3" }
      - { value: 0x3, name: lane_4_or_data_path_starting_lane_4, description: "Lane 4 or Data Path starting on lane 4" }
      - { value: 0x4, name: lane_5_or_data_path_starting_lane_5, description: "Lane 5 or Data Path starting on lane 5" }
      - { value: 0x5, name: lane_6_or_data_path_starting_lane_6, description: "Lane 6 or Data Path starting on lane 6" }
      - { value: 0x6, name: lane_7_or_data_path_starting_lane_7, description: "Lane 7 or Data Path starting on lane 7" }
      - { value: 0x7, name: lane_8_or_data_path_starting_lane_8, description: "Lane 8 or Data Path starting on lane 8" }
      - { value: 0xf, name: module, description: "Module, not associated with a lane or Data Path" }
    provenance:
      section: "CMIS 5.3 § 8.22.1.1"
      pdf_page: 273
      table: "Table 8-169"
      quote: "Monitored Resource"

  - name: observable_type
    display_name: ObservableTypeVDM<vdm_instance>
    since: "4.0"
    changed_in:
      # CMIS 5.4 Table 8-180 corrects the type-2 location (module -> media
      # lane(s)) and redefines type 4 as Laser Temperature Deviation; the
      # since-5.4 code set lives in CmisVdmObservableType5p4 (the in-place
      # enum keeps the pre-5.4 names, windowed until 5.3).
      - rev: "5.4"
        enum_ref: CmisVdmObservableType5p4
        provenance:
          section: "CMIS 5.4 § 8.27.3.2"
          pdf_page: 304
          table: "Table 8-180"
          quote: "VDM Observable Types (Type Coding)"
    instances: { index: vdm_instance, start: 1, end: 64 }
    offset_expr: "128 + 2 * (vdm_instance - 1) + 1"
    size_bytes: 1
    type: u8
    enum_ref: CmisVdmObservableType
    template: vdm_descriptor_field
    scope: { vdm_instance: vdm_instance }
    provenance:
      section: "CMIS 5.3 § 8.22.1.1"
      pdf_page: 273
      table: "Table 8-169"
      quote: "Observable Type"
