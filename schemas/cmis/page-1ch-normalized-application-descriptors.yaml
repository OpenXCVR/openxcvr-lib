schema: openxcvr.page.v1
kind: page
id: CmisPage1ChNormalizedApplicationDescriptors
title: CMIS Page 1Ch Normalized Application Descriptors (NAD-block-banked)
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 8.20
  pdf_pages: [267, 268]
page_address: "1Ch"
size_bytes: 128
present_when: "page_01h_advertising.nad_banks_supported > 0"

# Banked by NAD block index, not by lane. Each Bank holds NADBlockIndex values
# 1..15. Application Number AN = 15 * bank + nad_block_index; codegen and L2
# adapters own that arithmetic, not individual field declarations.
banking:
  bank_count_field: page_01h_advertising.nad_banks_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: nad_block_index
  dimension_size: 15

fields:

  # ===========================================================================
  # CMIS 5.3 § 8.20.1 Normalized Application Descriptor Format
  # bytes 128-247 - Tables 8-163 and 8-164
  # ===========================================================================

  - name: host_interface_id_nad
    display_name: HostInterfaceIDNAD<nad_block_index>
    instances: { index: nad_block_index, start: 1, end: 15 }
    offset_expr: "128 + 8 * (nad_block_index - 1)"
    size_bytes: 1
    type: u8
    enum_ref: Sff8024HostElectricalInterface
    access: ro
    field_type: Informational
    tags: [Information]
    scope: { nad_block_index: nad_block_index }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: true
      is_dynamic: false
    provenance:
      section: "CMIS 5.3 § 8.20.1"
      pdf_page: 268
      table: "Table 8-163"
      quote: "HostInterfaceID"

  - name: media_interface_id_nad
