    offset_expr: "128 + 8 * (nad_block_index - 1) + 1"
    size_bytes: 1
    type: u8
    variants:
      discriminator: { field: lower_memory.media_type }
      cases:
        - when: { value: 0x01 }
          enum_ref: Sff8024MmfMediaInterface
        - when: { value: 0x02 }
          enum_ref: Sff8024SmfMediaInterface
        - when: { value: 0x03 }
          enum_ref: Sff8024PassiveCableCodes
        - when: { value: 0x04 }
          enum_ref: Sff8024ActiveCableCodes
        - when: { value: 0x05 }
          enum_ref: Sff8024BaseTCodes
    access: ro
    field_type: Informational
    tags: [Information]
    scope: { nad_block_index: nad_block_index }
    flags:
      is_required: true
      is_readable: true
      is_writable: false
      is_ever_writable: true
      is_dynamic: false
    provenance:
      section: "CMIS 5.3 § 8.20.1"
      pdf_page: 268
      table: "Table 8-163"
      quote: "MediaInterfaceID"

