schema: openxcvr.enum.v2
kind: enum
id: CmisNetworkPathConfigStatus
title: CMIS Network Path Configuration Command Execution and Result Status (4-bit per-lane)
spec:
  id: cmis
  revision: "5.3"
provenance:
  spec: CMIS 5.3 § 8.15.3 / Table 8-141
  pdf_pages: [255]
entries:
  - value: 0x0
    name: config_undefined
    description: ConfigUndefined - no status information available (initial register value)
  - value: 0x1
    name: config_success
    description: ConfigSuccess - the last accepted Network Path configuration command has completed successfully
  - value: 0x2
    name: config_rejected
    description: ConfigRejected - configuration rejected, unspecific validation failure
  - value: 0x3
    name: config_rejected_invalid_app_sel
    description: ConfigRejectedInvalidAppSel - configuration rejected, invalid AppSel codes
  - value: 0x4
    name: config_rejected_invalid_network_path
    description: ConfigRejectedInvalidNetworkPath - configuration rejected, invalid set of lanes for AppSel
  - value: 0x5
    name: reserved_5
    description: Reserved
  - value: 0x6
    name: config_rejected_lanes_in_use
    description: ConfigRejectedLanesInUse - configuration rejected, some lanes not in NPDeactivated
  - value: 0x7
    name: config_rejected_partial_network_path
    description: ConfigRejectedPartialNetworkPath - configuration rejected, lanes are only a subset of the Network Path
  - value: 0x8..0xb
    name: reserved_8_b
    description: Reserved (other validation failures)
  - value: 0xc
    name: config_in_progress
    description: ConfigInProgress - a configuration command is still being processed by the module
  - value: 0xd..0xf
    name: custom_rejected
    description: Custom Configuration rejected for custom reasons (vendor-defined)
