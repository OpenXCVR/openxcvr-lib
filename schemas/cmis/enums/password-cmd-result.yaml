schema: openxcvr.enum.v2
kind: enum
id: CmisPasswordCmdResult
title: CMIS Password Command Result (4-bit)
spec:
  id: cmis
  revision: "5.3"
provenance:
  spec: CMIS 5.3 § 8.2.11 / Table 8-17
  pdf_pages: [154]
entries:
  - value: 0x0
    name: not_supported_legacy
    description: Password command result reporting is not supported; legacy behavior before CMIS 5.3
  - value: 0x1
    name: module_password_accepted
    description: Module password entry or change has been accepted
  - value: 0x2
    name: host_password_accepted
    description: Host password entry or change has been accepted
  - value: 0x3
    name: password_not_accepted
    description: Password entry was not accepted
  - value: 0x4..0x7
    name: reserved_4_7
    description: Reserved
  - value: 0x8
    name: password_validation_in_progress
    description: Password validation is in progress; host should avoid using password entry registers until a result is available
  - value: 0x9..0xf
    name: reserved_9_f
    description: Reserved
