schema: openxcvr.enum.v2
kind: enum
id: CmisVdmObservableType5p4
title: CMIS VDM Observable Type (CMIS 5.4 and later)
spec:
  id: cmis
  revision: "5.4"
description: >
  VDM observable type code set as printed by CMIS 5.4 Table 8-180 (p. 304).
  CmisVdmObservableType keeps the pre-5.4 window, where type 2 is TEC Current
  for the module and type 4 is absolute Laser Temperature; CMIS 5.4 corrects
  type 2 to a media-lane(s) observable (the 5.3 text had described it as
  module-only) and redefines type 4 as Laser Temperature Deviation (the
  deviation against the target temperature, S16, 1/256 degC). Revision-blind
  duplicate-value rules forbid two value-2/value-4 entries in one enum, so
  the since-5.4 meanings land here, following the CmisBanksSupported5p4
  precedent (ADV-01). Every other code point is unchanged from 5.3.
provenance:
  spec: CMIS 5.4 § 8.27.3.2 / Table 8-180
  pdf_pages: [304]
entries:
  - value: 0x00
    name: not_used
    since: "5.4"
    description: VDM instance is not active and presents no observable data
    tags: [data_type:none]
  - value: 0x01
    name: laser_age_media_lane
    since: "5.4"
    description: Laser age from 0 percent at BOL to 100 percent at EOL for a media lane
    tags: [data_type:u16, instance:basic]
  - value: 0x02
    name: tec_current_media_lanes
    since: "5.4"
    description: TEC current, reported for a media lane or group of media lanes (see CMIS 5.4 § 7.1.6.1)
    tags: [data_type:s16, instance:basic]
  - value: 0x03
