schema: openxcvr.enum.v2
kind: enum
id: CmisRedirectionCommitResult
title: CMIS Host Lane Switching Redirection Commit Result
spec:
  id: cmis
  revision: "5.3"
provenance:
  spec: CMIS 5.3 § 8.21 / Table 8-166
  pdf_pages: [270]
entries:
  - value: 0x00
    name: no_status
    description: No status (initial value)
  - value: 0x01
    name: command_execution_successful
    description: Command execution successful
  - value: 0x02
    name: command_execution_in_progress
    description: Command execution in progress
  - value: 0x03
    name: rejected_unspecific_validation_failure
    description: Rejected, unspecific validation failure
  - value: 0x04
    name: rejected_invalid_configuration_no_permutation
    description: Rejected, invalid configuration (no permutation)
  - value: 0x05
    name: rejected_inconsistent_with_active_data_path
    description: Rejected, inconsistent with active Data Path
  - value: 0x06
    name: rejected_lane_ordering_not_supported
    description: Rejected, lane ordering not supported
  - value: 0x07..0xff
    name: reserved_07_ff
    description: Reserved
