  - name: freeze_request
    display_name: FreezeRequest
    since: "4.0"
    offset: 144
    bit_offset: 7
    bit_width: 1
    type: bool
    access: rw
    changed_in:
      # CMIS 5.4 M7 clarifies and corrects the VDM freeze/unfreeze handshake
      # (§ 8.27.8): the module clears FreezeDone as a side effect of the WRITE
      # raising FreezeRequest (and clears UnfreezeDone when FreezeRequest is
      # ceased), and the frozen/kept registers explicitly include counter
      # values, not only minimum, maximum and average values.
      - rev: "5.4"
        behavior:
          freeze_handshake: "Module clears FreezeDone as part of the WRITE raising FreezeRequest; clears UnfreezeDone as part of the WRITE ceasing FreezeRequest; internally records new statistics while the reporting registers are frozen"
          frozen_registers: "minimum, maximum, average, and counter values"
        provenance:
          section: "CMIS 5.4 § 8.27.8"
          pdf_page: 311
          table: "Table 8-186"
          quote: "When raised by the host, the module clears FreezeDone and then starts to freeze and hold all statistics reporting registers (minimum, maximum, average, and counter values) in Pages 24h-27h. When ceased by the host, the module clears UnfreezeDone and then starts to update the statistics reporting registers again."
    behavior:
      write_effect: "Freezes or releases VDM statistics reporting registers across all supported groups"
      timing: tVDMF
      bank_broadcast: "Applies synchronously to all supported banks"
    field_type: Control
    tags: [Control, VDM]
    scope: { module: true }
    flags: { is_required: false, is_readable: true, is_writable: true, is_ever_writable: true, is_dynamic: true }
    provenance:
      section: "CMIS 5.3 § 8.22.6"
      pdf_page: 280
      table: "Table 8-176"
      quote: "FreezeRequest"

