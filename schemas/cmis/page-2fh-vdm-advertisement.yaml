  - name: freeze_done
    display_name: FreezeDone
    since: "4.0"
    offset: 145
    bit_offset: 7
    bit_width: 1
    type: bool
    access: ro
    changed_in:
      # CMIS 5.4 M7: FreezeDone is ceased by the module as part of the WRITE
      # raising FreezeRequest (the 5.3 text tied the cease to tVDMF from the
      # FreezeRequest, leaving raise and cease timing contradictory); it is
      # raised within tVDMF after the completed FreezeRequest WRITE.
      - rev: "5.4"
        behavior:
          cease_timing: "Ceased by the module as part of the WRITE raising FreezeRequest"
          raise_timing: "Raised within tVDMF after the completed FreezeRequest WRITE, when freezing is finished and internal statistics recording has restarted"
        provenance:
          section: "CMIS 5.4 § 8.27.8"
          pdf_page: 312
          table: "Table 8-186"
          quote: "Raised by the module (within TVDMF time from when Freeze Request is raised by the host) when it has finished freezing the reporting registers ... Ceased by the module (as part of the WRITE raising FreezeRequest)."
    behavior:
      timing: tVDMF
      status_scope: "Reflects FreezeRequest completion across all supported groups"
      initial_value: 0
    field_type: Status
    tags: [Status, VDM]
    scope: { module: true }
    flags: { is_required: false, is_readable: true, is_writable: false, is_ever_writable: false, is_dynamic: true }
    provenance:
      section: "CMIS 5.3 § 8.22.6"
      pdf_page: 280
      table: "Table 8-176"
      quote: "FreezeDone"

  - name: unfreeze_done
    display_name: UnfreezeDone
    since: "4.0"
    offset: 145
    bit_offset: 6
    bit_width: 1
    type: bool
    access: ro
    changed_in:
      # CMIS 5.4 M7: UnfreezeDone is ceased by the module as part of the
      # WRITE ceasing FreezeRequest; raised within tVDMF after that WRITE.
      - rev: "5.4"
        behavior:
          cease_timing: "Ceased by the module as part of the WRITE ceasing FreezeRequest"
          raise_timing: "Raised within tVDMF after the completed FreezeRequest-ceasing WRITE, when real-time updates of the reporting registers are performed again"
        provenance:
          section: "CMIS 5.4 § 8.27.8"
          pdf_page: 312
          table: "Table 8-186"
          quote: "Raised by the module (within TVDMF time from when Freeze Request is ceased by the host) when real-time updates of the reporting registers are performed again."
    behavior:
      timing: tVDMF
      status_scope: "Reflects unfreezing completion across all supported groups"
      initial_value: 0
    field_type: Status
    tags: [Status, VDM]
    scope: { module: true }
    flags: { is_required: false, is_readable: true, is_writable: false, is_ever_writable: false, is_dynamic: true }
    provenance:
