# VDM introduction window (since-window repair): the VDM feature, including
# this page, landed with CMIS 4.0 (CMIS 5.3 revision history, Rev 4.0 block:
# 'Added VDM Feature (Versatile Diagnostics Monitoring) (7.1)'; CMIS 4.0
# Table 8-105 defines this page with the identical group advertisement).
# CMIS 4.0 named the control bytes Latch Request / Latch Done / Latch Clear
# Done; the freeze terminology was introduced later. PowerSavingSupport /
# PowerSavingMode are CMIS 5.3 additions (5.3 revision history E19), and the
# duty-cycle registers are CMIS 5.4 additions (5.4 revision history E15,
# Table 8-186, p. 311).
