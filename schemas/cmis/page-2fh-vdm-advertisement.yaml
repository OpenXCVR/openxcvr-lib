  # CMIS 5.4 Table 8-186: byte 144 bits 5-2, allocated from the 5.3 reserved
  # bits 5-0 (E15). RW Adv., advertised via 2Fh:128.3 DutyCycleSupport.
  - name: monitoring_duty_cycle
    display_name: MonitoringDutyCycle
    since: "5.4"
    offset: 144
    bit_offset: 2
    bit_width: 4
    type: u4
    access: rw
    present_when: "duty_cycle_support == true"
    behavior:
      default: 10
      processing_fraction: "min(k, 10) * 10 percent of the samples of each observable that would normally be processed; the sub-sampling rhythm is unspecified and may differ per observable"
    field_type: Control
    tags: [Control, VDM]
    scope: { module: true }
    flags: { is_required: false, is_readable: true, is_writable: true, is_ever_writable: true, is_dynamic: true }
    provenance:
      section: "CMIS 5.4 § 8.27.8"
      pdf_page: 311
      table: "Table 8-186"
      quote: "U4: k, 0 <= k <= 10 (default). The module processes only a given fraction, min(k,10) - 10%, of the samples of each observable that would normally be processed."

