schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbGetInterfaceCodeDescription
title: CMIS CDB Command 0051h - Get Interface Code Description
spec:
  id: cmis
  revision: "5.4"
provenance:
  spec: CMIS 5.4 § 9.5.2
  pdf_pages: [343]
  table: Table 9-17
cmd_id: 0x0051
available_since: "5.3"
cmd_id_group: application_information
command_class: advertised
description: >
  Queries descriptive attributes of SFF-8024 host and media interface
  ID codes, including vendor-defined custom interfaces, so hosts can
  build descriptive pick lists for all Applications. Introduced in
  CMIS 5.3 (5.3 revision history 'CDB Messages Changes: 0051h added Get
  Interface ID Description query'). CMIS 5.4 extends the command: the
  parameter becomes the 16-bit Interface UID (GID bits 11-8 + ID bits
  7-0; E2 'Interface ID grows to 12-bit UID'), the reply adds
  BitsPerSymbolExact (F16) and GridSpacingMin (F16) (E8), and 9Fh:203 is
  Reserved for X16 alignment (M6 corrigendum of the 5.3 table's double
  use of 9Fh:139). Table 9-17 prints REPLY RPLLength 92 in both 5.3 and
  5.4 although the 5.4 reply fields run through byte 231 (96 bytes from
  136); the schema records the printed 92 and notes the arithmetic
  discrepancy here rather than silently picking either side.
  Table 9-17 prints REPLY RPLLength 92 in CMIS 5.3 and 5.4 while the 5.4 field layout (through byte 231) spans 96 bytes from byte 136; the printed value is recorded and the discrepancy noted in the description.
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: foreground
cmd:
  lpl:
    length: 3
    fields:
      - name: interface_uid
        offset: 136
        size_bytes: 2
        type: u16be
        template: cdb_cmd_parameter
        description: >
          U16: HostInterfaceUID or MediaInterfaceUID. Bits 15-12
          reserved (0); bits 11-8 HostInterfaceGID or MediaInterfaceGID (the
          12-bit UID layout is the CMIS 5.4 E2 change; through CMIS 5.3 bits
          15-8 were reserved and bits 7-0 carried the 8-bit InterfaceID); bits
          7-0 HostInterfaceID or MediaInterfaceID.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: interface_location
        offset: 138
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: media_side, description: "Query the media interface code" }
          - { value: 1, name: host_side, description: "Query the host interface code" }
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
reply:
  status_codes:
    - { value: 0x81, name: busy_capturing_command, meaning: "Busy processing command, CMD captured", since: "5.3" }
    - { value: 0x82, name: busy_checking_command, meaning: "Busy processing command, CMD checking", since: "5.3" }
    - { value: 0x83, name: busy_executing_command, meaning: "Busy processing command, CMD execution", since: "5.3" }
    - { value: 0x01, name: success, meaning: "Operation successful", since: "5.3" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "5.3" }
    - { value: 0x42, name: parameter_range_error, meaning: "Parameter range error or not supported", since: "5.3" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "5.3" }
  lpl:
    length: 92
    fields:
      - name: interface_id
        offset: 136
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          Unmodified CMD Data (InterfaceUID).
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: interface_location
        offset: 138
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          Unmodified CMD Data.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: interface_name
        offset: 139
        size_bytes: 16
        type: ascii
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          ASCII[16]: Short Name.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: interface_description
        offset: 155
        size_bytes: 48
        type: ascii
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          ASCII[48]: Description and Specification Reference.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: reserved_203
        offset: 203
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        tags: [CDB, Reserved]
        description: >
          Reserved (for alignment of the X16 fields below); the CMIS 5.4 M6 corrigendum places the alignment byte here, fixing the 5.3 table's double use of 9Fh:139.
        constraints: { equals: 0 }
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: interface_data_rate
        offset: 204
        size_bytes: 2
        type: f16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          F16: Application Bit Rate in Gb/s.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: interface_lane_count
        offset: 206
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          U16: Number of parallel lanes.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: lane_signaling_rate
        offset: 208
        size_bytes: 2
        type: f16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          F16: Lane Signaling Rate in GBd.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: modulation
        offset: 210
        size_bytes: 16
        type: ascii
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          ASCII[16]: Lane Modulation Format.
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: bits_per_symbol
        offset: 226
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          U16: Bits per Lane Modulation Symbol (rounded).
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: bits_per_symbol_exact
        offset: 228
        size_bytes: 2
        type: f16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          F16: Bits per Lane Modulation Symbol (not rounded). Added by CMIS 5.4 (E8).
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
      - name: grid_spacing_min
        offset: 230
        size_bytes: 2
        type: f16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          F16: Smallest optical grid spacing in GHz (0.0 if N/A). Added by CMIS 5.4 (E8).
        provenance: { spec: "CMIS 5.4 § 9.5.2", table: "Table 9-17" }
behavior:
  abort_supported: true
  retry_safe: true
  side_effects:
