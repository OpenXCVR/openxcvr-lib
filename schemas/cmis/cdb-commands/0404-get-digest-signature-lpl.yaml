schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbGetDigestSignatureLpl
title: CMIS CDB Command 0404h - Get Digest Signature in LPL
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 9.12.6
  pdf_pages: [349]
  table: Table 9-56
cmd_id: 0x0404
available_since: "5.3"
cmd_id_group: security
command_class: advertised
description: >
  Retrieves one LPL segment of the module signature over the most recently
  supplied digest. Repeated calls return the same signature until another Set
  Digest To Sign command is issued.
advertisement:
  via_cmd: 0x0044
  field: security_features.cmd_0404_supported
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
  - { field: digest_to_sign_state, equals: provided }
max_completion_time:
  source: advertised
  field: security_features.signature_time
processing_mode: foreground
cmd:
  lpl:
    length: 1
    fields:
      - name: segment_index
        offset: 136
        size_bytes: 1
        type: u8
        template: cdb_cmd_parameter
        provenance: { spec: "CMIS 5.3 § 9.12.6", table: "Table 9-56" }
reply:
  status_codes:
    - { value: 0x01, name: success, meaning: "Operation successful; inspect ReturnStatus for security result", since: "5.3" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "5.3" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "5.3" }
  detailed_status_codes:
    - { value: 0x0000, name: ok, meaning: "Successful command completion", since: "5.3" }
    - { value: 0x0001, name: communication_error, meaning: "General internal communication error", since: "5.3" }
    - { value: 0x0002, name: unexpected_error, meaning: "General unspecific error", since: "5.3" }
    - { value: 0x0010, name: user_command_data_error, meaning: "General command data error", since: "5.3" }
    - { value: 0x0011, name: user_no_digest_error, meaning: "Signature request without digest supplied before", since: "5.3" }
    - { value: 0x0012, name: user_not_ready_error, meaning: "Signature request during processing", since: "5.3" }
    - { value: 0x0020, name: sec_invalid_private_key, meaning: "Invalid private key", since: "5.3" }
    - { value: 0x0022, name: sec_device_not_found, meaning: "Security device not present or not operational", since: "5.3" }
    - { value: 0x0023, name: sec_device_read_error, meaning: "Security device read error", since: "5.3" }
  lpl:
    length: variable
    fields:
      - name: return_status
        offset: 136
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        provenance: { spec: "CMIS 5.3 § 9.12.6", table: "Table 9-56" }
      - name: segment_index
        offset: 138
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        provenance: { spec: "CMIS 5.3 § 9.12.6", table: "Table 9-56" }
      - name: signature_segment
        offset: 139
        size_bytes: 117
        type: bytes
        template: cdb_reply_field
        field_type: Informational
        tags: [CDB, Security, Signature]
        length_from: "page_9fh_cdb_message.rpl_length - 3"
        provenance: { spec: "CMIS 5.3 § 9.12.6", table: "Table 9-56" }
behavior:
  abort_supported: false
  retry_safe: true
  side_effects: []
