schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbFecSymbolErrorHistogramControl
title: CMIS CDB Command 0230h - Control FEC Symbol Error Weight Histogram
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 9.8.8
  pdf_pages: [333]
  table: Table 9-39
cmd_id: 0x0230
available_since: "5.3"
cmd_id_group: performance_monitoring
command_class: advertised
description: >
  Controls FEC Symbol Error Weight histogram collection for a selected data
  path and decoder location. The command can reset, start, or stop collection.
advertisement:
  via_cmd: 0x0042
  field: performance_monitoring_features.cmd_0230_supported
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: configurable
cmd:
  lpl:
    length: 2
    fields:
      - name: data_path_id
        offset: 136
        size_bytes: 1
        type: u8
        template: cdb_cmd_parameter
        scope: { data_path: selected }
        provenance: { spec: "CMIS 5.3 § 9.8.8", table: "Table 9-39" }
      - name: decoder_location
        offset: 137
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: media_side, description: "Media side decoder" }
          - { value: 1, name: host_side, description: "Host side decoder" }
        provenance: { spec: "CMIS 5.3 § 9.8.8", table: "Table 9-39" }
      - name: command
        offset: 137
        bit_offset: 1
        bit_width: 2
        type: u2
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: reset, description: "Clear statistics" }
          - { value: 1, name: start, description: "Clear statistics and start collecting" }
          - { value: 2, name: stop, description: "Stop collecting" }
        provenance: { spec: "CMIS 5.3 § 9.8.8", table: "Table 9-39" }
reply:
  status_codes:
    - { value: 0x81, name: busy_capturing_command, meaning: "Busy processing command, CMD captured", since: "5.3" }
    - { value: 0x82, name: busy_checking_command, meaning: "Busy processing command, CMD checking", since: "5.3" }
    - { value: 0x83, name: busy_executing_command, meaning: "Busy processing command, CMD execution", since: "5.3" }
    - { value: 0x01, name: success, meaning: "Operation successful", since: "5.3" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "5.3" }
    - { value: 0x42, name: parameter_range_error, meaning: "Parameter range error or not supported", since: "5.3" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "5.3" }
  lpl:
    length: 0
    fields: []
behavior:
  abort_supported: true
  retry_safe: false
  side_effects:
    - "May clear, start, or stop FEC symbol error weight histogram collection."
