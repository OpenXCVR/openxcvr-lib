schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbRmonStatistics
title: CMIS CDB Command 0220h - Get Data Path RMON Statistics
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 9.8.7
  pdf_pages: [332]
  table: Table 9-38
cmd_id: 0x0220
available_since: "5.3"
cmd_id_group: performance_monitoring
command_class: advertised
description: >
  Returns data-path RMON counters for the selected monitor location and data
  path. The reply uses saturating U48 and U32 counters in a fixed 120-byte LPL
  payload.
advertisement:
  via_cmd: 0x0042
  field: performance_monitoring_features.cmd_0220_supported
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: configurable
cmd:
  lpl:
    length: 2
    fields:
      - name: clear_on_read
        offset: 136
        bit_offset: 7
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        provenance: { spec: "CMIS 5.3 § 9.8.7", table: "Table 9-38" }
      - name: monitor_location
        offset: 136
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: media_side_rx, description: "Media side, Rx direction" }
          - { value: 1, name: host_side_tx, description: "Host side, Tx direction" }
        provenance: { spec: "CMIS 5.3 § 9.8.7", table: "Table 9-38" }
      - name: data_path_id
        offset: 137
        size_bytes: 1
        type: u8
        template: cdb_cmd_parameter
        scope: { data_path: selected }
        provenance: { spec: "CMIS 5.3 § 9.8.7", table: "Table 9-38" }
reply:
  status_codes:
    - { value: 0x81, name: busy_capturing_command, meaning: "Busy processing command, CMD captured", since: "5.3" }
    - { value: 0x82, name: busy_checking_command, meaning: "Busy processing command, CMD checking", since: "5.3" }
    - { value: 0x83, name: busy_executing_command, meaning: "Busy processing command, CMD execution", since: "5.3" }
    - { value: 0x01, name: success, meaning: "Operation successful", since: "5.3" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "5.3" }
    - { value: 0x42, name: parameter_range_error, meaning: "Parameter range error or not supported", since: "5.3" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "5.3" }
  lpl:
    length: 120
    fields:
      - name: rmon_u48_counters
        offset: 136
        size_bytes: 72
        type: bytes
        template: cdb_reply_field
        field_type: Telemetry
        tags: [CDB, Monitor, Counter]
        encoding:
          kind: repeated_u48be
          fields:
            - frame_count
            - octet_count
            - bad_frame_count
            - bad_octet_count
            - multicast_count
            - broadcast_count
            - packets_64b
            - packets_64_to_127b
            - packets_128_to_255b
            - packets_256_to_511b
            - packets_512_to_1023b
            - packets_1024_to_1518b
        provenance: { spec: "CMIS 5.3 § 9.8.7", table: "Table 9-38" }
      - name: rmon_u32_counters
        offset: 208
        size_bytes: 48
        type: bytes
        template: cdb_reply_field
        field_type: Telemetry
        tags: [CDB, Monitor, Counter]
        encoding:
          kind: repeated_u32be
          fields:
            - packets_large_non_jumbo
            - packets_jumbo
            - bad_multicast_count
            - bad_broadcast_count
            - bad_packets_64b
            - bad_packets_64_to_127b
            - bad_packets_128_to_255b
            - bad_packets_256_to_511b
            - bad_packets_512_to_1023b
            - bad_packets_1024_to_1518b
            - bad_packets_large_non_jumbo
            - bad_packets_jumbo
        provenance: { spec: "CMIS 5.3 § 9.8.7", table: "Table 9-38" }
behavior:
  abort_supported: true
  retry_safe: false
  side_effects:
    - "When clear_on_read is set, the selected RMON statistics are reset after the reply data is captured."
