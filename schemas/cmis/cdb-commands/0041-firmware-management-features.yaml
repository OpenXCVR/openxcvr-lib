        type: u8
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "0: reset, traffic affected; 1: best effort to maintain traffic and management states without data path reset. Other codes unknown."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: max_duration_start
        offset: 144
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Raw U16 maximum start duration count, in M ms; M is 1 or 10 from bit 137.3. Big endian per \u00a78.1.3.5."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: max_duration_abort
