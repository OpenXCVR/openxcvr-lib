schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbFirmwareManagementFeatures
title: CMIS CDB Command 0041h - Firmware Management Features
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 9.4.2
  pdf_pages: [296, 297]
  table: Table 9-9
cmd_id: 0x0041
# This layout is qualified only against 5.3; no earlier revision is inferred.
available_since: "5.3"
cmd_id_group: capabilities_inquiry
command_class: required
description: >
  Queries firmware management features and performance attributes. Does not
  advertise support for the required 0100h command or govern its admission.
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: foreground
cmd:
  lpl:
    length: 0
    fields: []
reply:
  status_codes:
    - { value: 0x01, name: success, meaning: "Operation successful", since: "5.3" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "5.3" }
    - { value: 0x42, name: parameter_range_error, meaning: "Parameter range error or not supported", since: "5.3" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "5.3" }
  lpl:
    length: 18
    fields:
      - name: reserved_136
        offset: 136
        size_bytes: 1
        type: bytes
        template: cdb_reply_field
        field_type: Reserved
        tags: [CDB, Firmware, Reserved]
        description: "Reserved byte retained raw."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: capabilities
        offset: 137
        size_bytes: 1
        type: bitmap
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Bit 7 ImageReadback; bits 6..4 reserved; bit 3 MaxDurationCoding (0: M=1, 1: M=10); bit 2 SkippingErasedBlocks; bit 1 CopyCmd (0108h); bit 0 AbortCmd (0102h)."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: start_cmd_payload_size
        offset: 138
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Number of initial firmware image bytes sent in CMD 0101h."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: erased_byte
        offset: 139
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Value representing an erased byte."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: read_write_length_ext
        offset: 140
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Raw i; maximum EPL length 8*(1+i); maximum LPL length 8*(1+min(i,15)). Applies to firmware management commands only."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: write_mechanism
        offset: 141
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Literal hex codes 00: none, 01: LPL, 10: EPL, 11: both. Other codes remain unknown."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: read_mechanism
        offset: 142
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Literal hex codes 00: none, 01: LPL, 10: EPL, 11: both. Other codes remain unknown."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: hitless_restart
