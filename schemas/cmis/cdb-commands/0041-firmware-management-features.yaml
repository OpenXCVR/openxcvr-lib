        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: max_duration_write
        offset: 148
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Raw U16 maximum write duration count, in M ms; M is 1 or 10 from bit 137.3. Big endian per \u00a78.1.3.5."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: max_duration_complete
        offset: 150
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Raw U16 maximum complete duration count, in M ms; M is 1 or 10 from bit 137.3. Big endian per \u00a78.1.3.5."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
      - name: max_duration_copy
        offset: 152
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        field_type: CapabilityAdvertisement
        tags: [CDB, Firmware, CapabilityAdvertisement]
        description: "Raw U16 maximum copy duration count, in M ms; M is 1 or 10 from bit 137.3. Big endian per \u00a78.1.3.5."
        provenance: { spec: "CMIS 5.3 § 9.4.2", table: "Table 9-9" }
behavior:
  abort_supported: false
  retry_safe: true
