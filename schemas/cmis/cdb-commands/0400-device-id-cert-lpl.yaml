schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbDeviceIdCertificateLpl
title: CMIS CDB Command 0400h - Get Initial Device ID Certificate in LPL
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 9.12.2
  pdf_pages: [345]
  table: Table 9-52
cmd_id: 0x0400
available_since: "5.3"
cmd_id_group: security
command_class: advertised
description: >
  Reads one LPL segment of the module Initial Device ID certificate or of a
  selected certificate in the certificate chain. Segment zero is requested
  first, followed by incrementing segment indices until the certificate length
  advertised by CMD 0044h is exhausted.
advertisement:
  via_cmd: 0x0044
  field: security_features.cmd_0400_supported
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
  - { field: security_features.certificate_format, in_range: [1, 2] }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: foreground
cmd:
  lpl:
    length: 2
    fields:
      - name: certificate_index
        offset: 136
        size_bytes: 1
        type: u8
        template: cdb_cmd_parameter
        constraints: { min: 0, max: 3 }
        provenance: { spec: "CMIS 5.3 § 9.12.2", table: "Table 9-52" }
      - name: segment_index
        offset: 137
        size_bytes: 1
        type: u8
        template: cdb_cmd_parameter
        provenance: { spec: "CMIS 5.3 § 9.12.2", table: "Table 9-52" }
reply:
  status_codes:
    - { value: 0x01, name: success, meaning: "Operation successful; inspect ReturnStatus for security result", since: "5.3" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "5.3" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "5.3" }
  detailed_status_codes:
    - { value: 0x0000, name: ok, meaning: "Successful command completion", since: "5.3" }
    - { value: 0x0001, name: communication_error, meaning: "General internal communication error", since: "5.3" }
    - { value: 0x0002, name: unexpected_error, meaning: "General unspecific error", since: "5.3" }
    - { value: 0x0010, name: user_command_data_error, meaning: "General command data error", since: "5.3" }
    - { value: 0x0021, name: sec_invalid_public_key, meaning: "Invalid public key in certificate", since: "5.3" }
    - { value: 0x0022, name: sec_device_not_found, meaning: "Security device not present or not operational", since: "5.3" }
    - { value: 0x0023, name: sec_device_read_error, meaning: "Security device read error", since: "5.3" }
  lpl:
    length: variable
    fields:
      - name: return_status
        offset: 136
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        provenance: { spec: "CMIS 5.3 § 9.12.2", table: "Table 9-52" }
      - name: segment_index
        offset: 138
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        provenance: { spec: "CMIS 5.3 § 9.12.2", table: "Table 9-52" }
      - name: certificate_segment
        offset: 139
        size_bytes: 117
        type: bytes
        template: cdb_reply_field
        field_type: Informational
        tags: [CDB, Security, Certificate]
        length_from: "page_9fh_cdb_message.rpl_length - 3"
        provenance: { spec: "CMIS 5.3 § 9.12.2", table: "Table 9-52" }
behavior:
  abort_supported: false
  retry_safe: true
  side_effects: []
