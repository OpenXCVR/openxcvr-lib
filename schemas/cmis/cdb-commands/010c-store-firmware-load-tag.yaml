schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbStoreFirmwareLoadTag
title: CMIS CDB Command 010Ch - Store Firmware Load Tag
spec:
  id: cmis
  revision: "5.4"
provenance:
  spec: CMIS 5.4 § 9.6.14
  pdf_pages: [362]
  table: Table 9-32
cmd_id: 0x010c
available_since: "5.4"
cmd_id_group: firmware_management
command_class: advertised
description: >
  Stores a host-defined 64-byte Firmware Load Tag vector for the load
  in Bank A or Bank B (associating the downloaded firmware load with a
  firmware package stored on the host system), or clears the stored tag
  (Control = 1, ignoring LoadTag). See section 7.11.1. New in CMIS 5.4
  ('CMD 010Ch: Store/Clear Firmware Load Tag (new)'). Advertised by the
  Persistent Firmware Load Tag support bit, Page 0Ch FwSupportDetails
  194.5 (FirmwareLoadTagSupported). The Table 9-18 Type cell prints
  blank in the parsed 5.4 text; the command is recorded as advertised.
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: foreground
cmd:
  lpl:
    length: 66
    fields:
      - name: bank
        offset: 136
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: bank_a, description: "Store the Firmware Load Tag for the Load in Bank A" }
          - { value: 1, name: bank_b, description: "Store the Firmware Load Tag for the Load in Bank B" }
        provenance: { spec: "CMIS 5.4 § 9.6.14", table: "Table 9-32" }
      - name: control
        offset: 137
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: store_tag, description: "Store the LoadTag vector" }
          - { value: 1, name: clear_tag, description: "Clear the stored Firmware Load Tag (ignoring LoadTag)" }
        provenance: { spec: "CMIS 5.4 § 9.6.14", table: "Table 9-32" }
      - name: load_tag
        offset: 138
        size_bytes: 64
        type: bytes
        template: cdb_cmd_parameter
        description: >
          U8[64] host-defined Firmware Load Tag vector.
        provenance: { spec: "CMIS 5.4 § 9.6.14", table: "Table 9-32" }
