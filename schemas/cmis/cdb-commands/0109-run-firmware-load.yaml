schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbRunFirmwareLoad
title: CMIS CDB Command 0109h - Run Firmware Load
spec:
  id: cmis
  revision: "5.4"
provenance:
  spec: CMIS 5.4 § 9.6.11
  pdf_pages: [359]
  table: Table 9-29
cmd_id: 0x0109
available_since: "4.0"
cmd_id_group: firmware_management
command_class: conditionally_required
description: >
  Activates (runs) the firmware load from a selected firmware bank,
  with options specifying if and how traffic integrity and configuration
  should be preserved. Present since CMIS 4.0 (4.0 § 9.6.10 'CMD 0109h:
  Run FW Image'; the 5.3 revision history's CDB additions do not list
  it); the 5.4 rename ImageToRun -> LoadToRunAndImpact carries the new
  codes 4 (Switch to Inactive, configuration preserved, hits allowed)
  and 5 (Restart Active, configuration preserved, hits allowed), the
  config-preserving activation modes of CDB-06. When a hitless activation
  attempt is requested successfully, the activation should be
  non-disruptive or minimally disruptive; when activation with
  configuration preservation is requested successfully, the module will
  aim at maintaining all data path configurations and steady state
  indications (like ACS). The module should reject execution if the
  desired mode is not supported; CMD 010Bh checks availability
  dynamically. The maximum duration of a successful execution equals
  that of a regular reboot via ResetS (mainly governed by tMgmtInit).
  The command does not return a REPLY on success (Table 9-29: see Table 8-13 for In Progress, Table 9-19 for On Failure).
advertisement:
  via_cmd: 0x0041
  bit: '9Fh:137.1'
  meaning: 'run/switch firmware support (the 5.4 Table 9-18 row cites CMD 0041h 9Fh:137.1; the 0041h reply renames the bit CopyCmd for CMD 0108h - the pre-5.4 0109h advertisement bit)'
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: foreground
cmd:
  lpl:
    length: 4
    fields:
      - name: reserved_136
        offset: 136
        size_bytes: 1
        type: bytes
        template: cdb_cmd_parameter
        field_type: Reserved
        tags: [CDB, Reserved]
        constraints: { equals: 0 }
        provenance: { spec: "CMIS 5.4 § 9.6.11", table: "Table 9-29" }
      - name: load_to_run_and_impact
        offset: 137
        bit_offset: 0
        bit_width: 8
        type: u8
        template: cdb_cmd_parameter
        description: >
          Reset is expected to be a software-initiated module reset, equivalent to the SoftwareReset bit 00h:26.3. The module should reject execution if the desired mode is not supported.
        enum_inline:
          - { value: 0, name: reset_start_inactive, description: "Reset and start from Inactive Bank" }
          - { value: 1, name: switch_inactive_hitless, description: "Switch to Inactive, hitless (attempt)" }
          - { value: 2, name: reset_start_active, description: "Reset and start from Active Bank" }
          - { value: 3, name: restart_active_hitless, description: "Restart Active, hitless (attempt)" }
          - { value: 4, name: switch_inactive_config_preserved, description: "Switch to Inactive, configuration preserved, hits allowed (CMIS 5.4 addition)" }
          - { value: 5, name: restart_active_config_preserved, description: "Restart Active, configuration preserved, hits allowed (CMIS 5.4 addition)" }
        provenance: { spec: "CMIS 5.4 § 9.6.11", table: "Table 9-29" }
      - name: delay_to_reset
        offset: 138
        size_bytes: 2
        type: u16be
        template: cdb_cmd_parameter
        description: >
          U16: delay in ms before a reset, switch, or restart will
          occur after this command has completed. When DelayToReset is 0, the
          module may reset, switch, or restart before the host has read the
          CdbStatus.
        provenance: { spec: "CMIS 5.4 § 9.6.11", table: "Table 9-29" }
reply:
  status_codes:
    - { value: 0x81, name: busy_capturing_command, meaning: "Busy processing command, CMD captured", since: "4.0" }
    - { value: 0x82, name: busy_checking_command, meaning: "Busy processing command, CMD checking", since: "4.0" }
    - { value: 0x83, name: busy_executing_command, meaning: "Busy processing command, CMD execution", since: "4.0" }
    - { value: 0x41, name: failed_cmd_not_supported, meaning: "Command not supported (Table 9-19 FailedCmdNotSupported)", since: "4.0" }
    - { value: 0x44, name: failed_timeout, meaning: "Command checking timeout (Table 9-19 FailedTimeout)", since: "4.0" }
    - { value: 0x46, name: reject_privileged, meaning: "Privilege related error, e.g. password required (Table 9-19 RejectPrivileged)", since: "4.0" }
    - { value: 0x47, name: reject_not_now, meaning: "Cannot execute command in current situation (Table 9-19 RejectNotNow)", since: "4.0" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed to validate or execute, no specific failure", since: "4.0" }
    - { value: 0x60, name: reject_unspecific, meaning: "Unspecific reason to reject execution (Table 9-19 Reject, code 32)", since: "5.4" }
    - { value: 0x61, name: reject_invalid_load_format, meaning: "Load format not valid (Table 9-19 RejectInvalidLoadFormat, code 33)", since: "5.4" }
    - { value: 0x62, name: reject_invalid_load_checksum, meaning: "Load internal checksum(s) not valid (Table 9-19 RejectInvalidLoadChecksum, code 34)", since: "5.4" }
    - { value: 0x63, name: reject_invalid_load_authentication, meaning: "Load authentication has failed (Table 9-19 RejectInvalidLoadAuthentication, code 35)", since: "5.4" }
    - { value: 0x64, name: reject_invalid_load_target, meaning: "Load not suitable for this hardware (Table 9-19 RejectInvalidLoadTarget, code 36)", since: "5.4" }
    - { value: 0x65, name: reject_invalid_load, meaning: "Load not supported, other unspecific reason (Table 9-19 RejectInvalidLoad, code 37)", since: "5.4" }
    - { value: 0x66, name: reject_hitless_activation_not_available, meaning: "Hitless load activation not available (Table 9-19 RejectHitlessActivationNotAvailable, code 38)", since: "5.4" }
    - { value: 0x67, name: reject_config_preservation_not_available, meaning: "Load activation with configuration preservation not available (Table 9-19 RejectConfigPreservationNotAvailable, code 39)", since: "5.4" }
  lpl:
    length: 0
    fields: []
behavior:
  abort_supported: true
  retry_safe: false
  side_effects:
    - "Transfers control from the currently running firmware to a selected firmware load; a reset, switch or restart occurs after DelayToReset ms."
