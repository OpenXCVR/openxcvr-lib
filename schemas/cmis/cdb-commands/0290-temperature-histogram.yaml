schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbTemperatureHistogram
title: CMIS CDB Command 0290h - Temperature Histogram
spec:
  id: cmis
  revision: "5.3"
  errata:
    - revision: "1.0"
      source: docs/stds/cmis/OIF-CMIS-05-Errata-01.0.pdf
provenance:
  spec: CMIS 5.3 § 9.9.3
  pdf_pages: [339, 340]
  table: Table 9-46
cmd_id: 0x0290
available_since: "4.0"
cmd_id_group: data_recording
command_class: optional
description: >
  Manages and retrieves a non-volatile temperature residency histogram. The
  reply reports total accumulation time and seconds spent in 10 degree C bins.
advertisement:
  via_cmd: 0x0042
  field: performance_monitoring_features.cmd_0290_supported
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: configurable
cmd:
  lpl:
    length: 1
    fields:
      - name: subcommands
        offset: 136
        size_bytes: 1
        type: bitmap
        template: cdb_cmd_parameter
        behavior:
          bits:
            1: save_current_histogram_to_nvr
            2: return_histogram_10degc_bins
            7: clear_temperature_histogram
        provenance: { spec: "CMIS 5.3 § 9.9.3", table: "Table 9-46" }
reply:
  status_codes:
    - { value: 0x81, name: busy_capturing_command, meaning: "Busy processing command, CMD captured", since: "4.0" }
    - { value: 0x82, name: busy_checking_command, meaning: "Busy processing command, CMD checking", since: "4.0" }
    - { value: 0x83, name: busy_executing_command, meaning: "Busy processing command, CMD execution", since: "4.0" }
    - { value: 0x01, name: success, meaning: "Operation successful", since: "4.0" }
    - { value: 0x40, name: failed_no_specific, meaning: "Failed, no specific failure", since: "4.0" }
    - { value: 0x42, name: parameter_range_error, meaning: "Parameter range error or not supported", since: "4.0" }
    - { value: 0x45, name: cdb_chk_code_error, meaning: "CdbChkCode error", since: "4.0" }
  lpl:
    length: 52
    fields:
      - name: subcommands_echo
        offset: 136
        size_bytes: 1
        type: bitmap
        template: cdb_reply_field
        provenance: { spec: "CMIS 5.3 § 9.9.3", table: "Table 9-46" }
      - name: hours_to_next_nvr_write
        offset: 137
        size_bytes: 1
        type: u8
        template: cdb_reply_field
        field_type: Status
        tags: [CDB, Status, Storage]
        enum_inline:
          - { value: 0, name: not_indicated, description: "Module does not indicate hours to next NVR write" }
          - { value: 1..254, name: hours_until_write, description: "Histogram will be written to NVR within this many hours" }
          - { value: 255, name: host_trigger_required, description: "NVR write needs to be triggered by host" }
        provenance: { spec: "CMIS 5.3 § 9.9.3", table: "Table 9-46" }
      - name: total_seconds
        offset: 140
        size_bytes: 4
        type: u32be
        template: cdb_reply_field
        field_type: Telemetry
        tags: [CDB, Monitor, Temperature]
        provenance: { spec: "CMIS 5.3 § 9.9.3", table: "Table 9-46" }
      - name: ten_degree_temperature_bins
        offset: 144
        size_bytes: 44
        type: bytes
        template: cdb_reply_field
        field_type: Telemetry
        tags: [CDB, Monitor, Temperature, Histogram]
        encoding:
          kind: repeated_u32be
          fields:
            - ten_deg_bin_below_m5
            - ten_deg_bin_0
            - ten_deg_bin_10
            - ten_deg_bin_20
            - ten_deg_bin_30
            - ten_deg_bin_40
            - ten_deg_bin_50
            - ten_deg_bin_60
            - ten_deg_bin_70
            - ten_deg_bin_80
            - ten_deg_bin_above_85
        provenance: { spec: "CMIS 5.3 § 9.9.3", table: "Table 9-46" }
behavior:
  abort_supported: true
  retry_safe: false
  side_effects:
    - "May save the current histogram to non-volatile memory."
    - "May clear the non-volatile temperature histogram."
