schema: openxcvr.cdb_command.v1
kind: cdb_command
id: CmisCdbGetMaxFecSymbolErrorWeight
title: CMIS CDB Command 0233h - Get Max FEC Symbol Error Weight
spec:
  id: cmis
  revision: "5.4"
provenance:
  spec: CMIS 5.4 § 9.7.11
  pdf_pages: [380, 381]
  table: Table 9-46
cmd_id: 0x0233
available_since: "5.3"
cmd_id_group: performance_monitoring
command_class: advertised
description: >
  Returns the maximum FEC symbol error weight observed per Data Path
  since the last clear, together with the FEC correction capability.
  Introduced in CMIS 5.3 (5.3 revision history E42: '0232h-0233h added
  Maximum FEC Symbol Error Weight statistics'). The BankIndex parameter
  at 9Fh:136 (the bank of the group of 8 lanes of interest) is defined by
  CMIS 5.4 for modules with more than 32 lanes; through CMIS 5.3 the
  byte was Reserved (CDB-10).
advertisement:
  via_cmd: 0x0042
  field: performance_monitoring_features.cmd_0233_supported
preconditions:
  - { field: lower_memory.cdb_status.cdb_is_busy, equals: false }
max_completion_time:
  source: advertised
  field: cdb_module_features.max_completion_time
processing_mode: foreground
cmd:
  lpl:
    length: 2
    fields:
      - name: bank_index
        offset: 136
        size_bytes: 1
        type: u8
        template: cdb_cmd_parameter
        description: >
          The bank index for the group of 8 lanes of interest (CMIS 5.4 >32-lane extension; Reserved through CMIS 5.3).
        provenance: { spec: "CMIS 5.4 § 9.7.11", table: "Table 9-46" }
      - name: decoder_location
        offset: 137
        bit_offset: 0
        bit_width: 1
        type: bool
        template: cdb_cmd_parameter
        enum_inline:
          - { value: 0, name: media_side, description: "Media side, Rx direction" }
          - { value: 1, name: host_side, description: "Host side, Tx direction" }
        provenance: { spec: "CMIS 5.4 § 9.7.11", table: "Table 9-46" }
