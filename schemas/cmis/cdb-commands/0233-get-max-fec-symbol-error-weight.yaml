        provenance: { spec: "CMIS 5.4 § 9.7.11", table: "Table 9-46" }
      - name: correction_capability
        offset: 138
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
          U16: number of correctable FEC symbols per FEC frame.
        provenance: { spec: "CMIS 5.4 § 9.7.11", table: "Table 9-46" }
      - name: max_error_weight_dpid1
        offset: 140
        size_bytes: 2
        type: u16be
        template: cdb_reply_field
        tags: [CDB, Status]
        description: >
