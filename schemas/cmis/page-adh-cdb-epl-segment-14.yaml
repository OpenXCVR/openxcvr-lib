# EPL segment page for the CDB window. When CdbAutoPagingSupported is set
# (01h:163.4), host READ/WRITE access past the end of an EPL page advances to
# the next EPL page and wraps after the last supported segment.
banking:
  bank_count_field: page_01h_advertising.cdb_instances_supported
  bank_select_field: lower_memory.bank_select
  per_bank_dimension: cdb_instance
  dimension_size: 1

fields:
  - name: epl_segment_14
    display_name: EPLSegment14
    offset: 128
    size_bytes: 128
    type: bytes
    access: rw
    field_type: Storage
    tags: [CDB, EPL]
    scope: { cdb_instance: 0 }
    flags:
      is_required: false
      is_readable: true
      is_writable: true
      is_ever_writable: true
      is_dynamic: true
    provenance:
      section: "CMIS 5.3 § 8.24"
      pdf_page: 286
      table: "Table 8-181"
      quote: "EPLSegment14 is the 14th 128 bytes segment of the overall Extended Payload (EPL) area, where 14 is a sequential segment number, starting with EPLSegment1 (on Page A0h) and counting up to EPLSegment16 (on Page AFh)."
