schema: openxcvr.enum.v2
kind: enum
id: Sff8024BaseTCodes
title: SFF-8024 BASE-T Media Interface Codes
spec:
  id: sff-8024
  revision: "4.14"
provenance:
  spec: SFF-8024 4.14 Table 4-10
  pdf_pages: [35]
entries:
  - value: 0x00
    name: undefined
    description: Undefined BASE-T media interface
    reach: {kind: none}
  - value: 0x01
    name: base_1000_t
    description: 1000BASE-T media interface
    signaling: {lane_count: 4, lane_rate_gbd: 0.125, modulation: other:pam5}
    reach: {kind: base_t}
    bit_rate_gbps: 1.12
  - value: 0x02
    name: base_2_5g_t
    description: 2.5GBASE-T media interface
    signaling: {lane_count: 4, lane_rate_gbd: 0.200, modulation: other:pam16}
    reach: {kind: base_t}
    bit_rate_gbps: 2.50
  - value: 0x03
    name: base_5g_t
    description: 5GBASE-T media interface
    signaling: {lane_count: 4, lane_rate_gbd: 0.400, modulation: other:pam16}
    reach: {kind: base_t}
    bit_rate_gbps: 5.00
  - value: 0x04
    name: base_10g_t
    description: 10GBASE-T media interface
    signaling: {lane_count: 4, lane_rate_gbd: 0.800, modulation: other:pam16}
    reach: {kind: base_t}
    bit_rate_gbps: 10.00
  - value: 0x05
    name: base_25g_t
    description: 25GBASE-T media interface
    signaling: {lane_count: 4, lane_rate_gbd: 2.000, modulation: other:pam16}
    reach: {kind: base_t}
    bit_rate_gbps: 25
  - value: 0x06
    name: base_40g_t
    description: 40GBASE-T media interface
    signaling: {lane_count: 4, lane_rate_gbd: 3.200, modulation: other:pam16}
    reach: {kind: base_t}
    bit_rate_gbps: 40
  - value: 0x07
    name: base_50g_t_placeholder
    description: 50GBASE-T placeholder media interface
    reach: {kind: base_t}
  - value: 0x08..0xbf
    name: reserved_08_bf
    description: Reserved
    reach: {kind: none}
  - value: 0xc0..0xff
    name: vendor_specific
    description: Custom BASE-T media interface
    reach: {kind: base_t}
