schema: openxcvr.enum.v2
kind: enum
id: Sff8024ActiveCableCodes
title: SFF-8024 Limiting and Retimed Active Cable Codes
spec:
  id: sff-8024
  revision: "4.14"
provenance:
  spec: SFF-8024 4.14 Table 4-9
  pdf_pages: [35]
entries:
  - value: 0x00
    name: undefined
    description: Undefined limiting, retimed, or active loopback media interface
    reach: {kind: none}
  - value: 0x01
    name: active_cable_ber_1e_12
    description: Active cable assembly with BER below 1e-12
    tags: [limiting_active]
    reach: {kind: active_copper}
  - value: 0x02
    name: active_cable_ber_5e_5
    description: Active cable assembly with BER below 5e-5
    tags: [retimed_active]
    reach: {kind: active_copper}
  - value: 0x03
    name: active_cable_ber_2_6e_4
    description: Active cable assembly with BER below 2.6e-4
    tags: [retimed_active]
    reach: {kind: active_copper}
  - value: 0x04
    name: active_cable_ber_1e_6
    description: Active cable assembly with BER below 1e-6
    tags: [retimed_active]
    reach: {kind: active_copper}
  - value: 0x05..0xbe
    name: reserved_05_be
    description: Reserved
    reach: {kind: none}
  - value: 0xbf
    name: active_loopback_module
    description: Active loopback module
    tags: [loopback]
    reach: {kind: active_copper}
  - value: 0xc0..0xff
    name: vendor_specific
    description: Vendor specific/custom active cable media interface
    reach: {kind: active_copper}
