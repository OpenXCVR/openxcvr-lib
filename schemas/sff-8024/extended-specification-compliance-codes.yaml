id: Sff8024ExtendedSpecCompliance
title: SFF-8024 Extended Specification Compliance Codes
spec:
  id: sff-8024
  revision: "4.14"
provenance:
  spec: SFF-8024 4.14 Table 4-4
  pdf_pages: [20, 21, 22]
# ---------------------------------------------------------------------------
# Family grouping (OpenXCVR/openxcvr#34, criterion 3). Comment-only: this
# annotation adds `#` comment lines only. No value, name, description, range,
# entry order, key, type or metadata below is changed by it.
#
# Each entry is labelled with the interface families that its own SFF-8024
# Table 4-4 "Description of Module Capability" text names (section 4.5, held
# locally as the sibling repository's
# docs/stds/sff-8024/SFF-8024-Rev4.14.pdf, table pages 20-22). A row whose own
# text names none of the families in use is marked `unclassified`; no family
# is inferred for it. Where a row names a rate only through a host interface
# (25GAUI, 50GAUI, 100GAUI, 200GAUI) that rate is still its family, and where
# a row states a reach without a rate (0x24 4WDM-40 MSA) only the family its
# text does name is applied.
#
# The index below is the same labelling read the other way round; it is derived
# from the per-entry comments, so an edit to one needs the matching edit to the
# other. `25G/50G family` (the issue's grouping) is the union of the 25G and 50G
# lines. Table 4-4 has no 800G row, so the 800G line is intentionally empty; the
# 800G codes live in Tables 4-5, 4-6 and 4-7.
#
# Family index (codes as printed in this file):
#   2.5G                 : 0x1e
#   5G                   : 0x1d
#   10G                  : 0x11, 0x16, 0x1c, 0x37
#   25G                  : 0x01, 0x02, 0x03, 0x04, 0x08, 0x0b, 0x0c, 0x0d, 0x18, 0x19, 0x38
#   40G                  : 0x10, 0x12, 0x1f
#   50G                  : 0x0b, 0x0c, 0x0d, 0x30, 0x31, 0x32, 0x33, 0x39, 0x40, 0x41, 0x42, 0x45
#                          0x4a
#   100G                 : 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0b, 0x17, 0x18
#                          0x19, 0x1a, 0x1b, 0x20, 0x21, 0x22, 0x23, 0x25, 0x26, 0x27, 0x28, 0x29
#                          0x2a, 0x2b, 0x2c, 0x2d, 0x2e, 0x2f, 0x30, 0x31, 0x32, 0x33, 0x34, 0x35
#                          0x36, 0x3a, 0x3f, 0x40, 0x41
#   200G                 : 0x29, 0x30, 0x31, 0x32, 0x33, 0x36, 0x3f, 0x40, 0x41, 0x42, 0x43, 0x44
#                          0x46
#   400G                 : 0x29, 0x2a, 0x36, 0x3f, 0x47, 0x48, 0x49, 0x4b, 0x4c
#   800G                 : -
#   BiDi                 : 0x21
#   ZR coherent          : 0x4c
#   BASE-T               : 0x16, 0x1c, 0x1d, 0x1e
#   G.959.1              : 0x13, 0x14, 0x15
#   4WDM MSA             : 0x22, 0x23, 0x24
#   single-pair Ethernet : 0x0e
#   Fibre Channel        : 0x7f, 0x80, 0x81
#   unclassified         : 0x00, 0x0a, 0x0f, 0x3b..0x3e, 0x4d..0x7e, 0x82..0xff
#
# The file's `provenance:` revision label is separate and unchanged here.
