fields:
  # ===========================================================================
  # OIF-CMIS-FF-01.0 § 7.7, Table 15: Fibre Channel Rate Select
  # (bytes 133-134)
  # ===========================================================================

  - name: hw_rate_select_supported
    display_name: HWRateSelectSupported
    description: >-
      Module supports hardware rate select (0b: not supported, 1b:
      supported).
    offset: 133
    bit_offset: 7
    bit_width: 1
    type: bool
    access: ro
    field_type: CapabilityAdvertisement
    tags: [CMIS-FF, Advertisement]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      spec: OIF-CMIS-FF-01.0
      section: "§ 7.7"
      pdf_page: 30
      table: "Table 15"
      quote: "Module supports hardware rate select 0b: Not supported 1b: Supported"

  - name: rate_select_mode
    display_name: RateSelectMode
    description: >-
      Rate selection by hardware signals (0b: enabled — the state of the rate
      select hardware signal(s) determines which preprogrammed CMIS staged
      control set is applied during configuration (ApplyDPInit) or applied on
      state change of these signals (ApplyImmediate); 1b: disabled — the rate
      selection hardware signals are not evaluated and the module behaves
      like a regular CMIS module).
    offset: 133
    bit_offset: 6
    bit_width: 1
    type: bool
    access: ro
    field_type: Status
    tags: [CMIS-FF, Status]
    scope: { module: true }
    flags:
      is_required: false
      is_readable: true
      is_writable: false
      is_ever_writable: false
      is_dynamic: false
    provenance:
      spec: OIF-CMIS-FF-01.0
      section: "§ 7.7"
      pdf_page: 30
      table: "Table 15"
      quote: "Rate selection by HWsignals 0b: Enabled. The state of the rate select hardware signal(s) determines which preprogrammed CMIS staged control set is applied during configuration (ApplyDPInit) or applied on state change of these signals (ApplyImmediate). 1b: Disabled."

