  # Tier-2 legacy window: the SFF-8079 software application-select controls
  # occupied bytes 89-97 through SFF-8636 Rev 2.9 (Rx channels 89-92, Tx 94-97);
  # the v2.11 map reserves them ("Prior to Rev 2.10 used for SFF-8079").
  - name: sff8079_rx_application_select
    display_name: Rx<lane>ApplicationSelect
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "89 + (4 - lane)"
    size_bytes: 1
    type: u8
    template: control
    scope: { lane: lane }
    until: "2.11"
    provenance:
      section: "SFF-8636 Rev 2.9 § 6.2.6"
      pdf_page: 37
      table: "Table 6-9"
      quote: "Software Application Select per SFF-8079, Rx channels"
      lineage: "SFF-8636 Rev 2.9 Table 5-3/6-9; removed in Rev 2.10 — v2.11 Table 6-10 byte 89-92: 'Prior to Rev 2.10 used for SFF-8079' (tier-2 legacy window, 2.9 PDF)"

  - name: sff8079_tx_application_select
    display_name: Tx<lane>ApplicationSelect
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "94 + (4 - lane)"
    size_bytes: 1
    type: u8
    template: control
    scope: { lane: lane }
    until: "2.11"
    provenance:
      section: "SFF-8636 Rev 2.9 § 6.2.6"
      pdf_page: 37
      table: "Table 6-9"
      quote: "Software Application Select per SFF-8079, Tx channels"
      lineage: "SFF-8636 Rev 2.9 Table 5-3/6-9; removed in Rev 2.10 — v2.11 Table 6-10 reserves bytes 94-97 (tier-2 legacy window, 2.9 PDF)"

