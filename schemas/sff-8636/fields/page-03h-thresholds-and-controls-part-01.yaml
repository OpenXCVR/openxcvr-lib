      - { value: 1, name: steady_state_constant, description: "Steady-state constant" }
      - { value: 2, name: averaged_constant, description: "Average of peak-to-peak and steady-state stays constant" }
      - { value: 3, name: reserved, description: "Reserved" }
    since: "2.5"
    provenance: { section: "SFF-8636 v2.11 § 6.6.2", pdf_page: 61, table: "Table 6-29", quote: "Rx output emphasis type", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.5: 'Added Byte 225 bits 5-4 Rx output emphasis type'" }

  - name: rx_output_amplitude_supported
    display_name: RxOutputAmplitude<code>Supported
    instances: { index: code, start: 0, end: 3 }
    offset: 225
    bit_offset_expr: "code"
    bit_width: 1
    type: bool
    template: capability_flag
    scope: { module: true }
    enum_inline:
      - { value: 0, name: amplitude_0000, description: "Rx output amplitude code 0000 supported" }
      - { value: 1, name: amplitude_0001, description: "Rx output amplitude code 0001 supported" }
      - { value: 2, name: amplitude_0010, description: "Rx output amplitude code 0010 supported" }
      - { value: 3, name: amplitude_0011, description: "Rx output amplitude code 0011 supported" }
    since: "2.0"
    provenance: { section: "SFF-8636 v2.11 § 6.6.2", pdf_page: 61, table: "Table 6-29", quote: "Rx output amplitude support", lineage: "SFF-8636 Rev 2.12 change history, Rev 1.9: 'Added Rx output amplitude support indicators in Page 03h Byte 225'" }

