fields:
  - name: temp_mon_threshold
    display_name: TempMon<severity>Threshold
    instances: { index: severity, start: 0, end: 3 }
    offset_expr: "128 + 2 * severity"
    size_bytes: 2
    type: i16be
    encoding: { kind: scaled_signed, lsb_units: "1/256 deg C" }
    template: threshold
    tags: [AlarmThreshold, AlarmThresholdValue, "Monitor::Temperature"]
    enum_inline:
      - { value: 0, name: high_alarm, description: "High alarm threshold" }
      - { value: 1, name: low_alarm, description: "Low alarm threshold" }
      - { value: 2, name: high_warning, description: "High warning threshold" }
      - { value: 3, name: low_warning, description: "Low warning threshold" }
    provenance: { section: "SFF-8636 v2.11 § 6.6.1", pdf_page: 59, table: "Table 6-28", quote: "Temperature thresholds" }

