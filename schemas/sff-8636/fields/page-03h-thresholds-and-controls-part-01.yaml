    offset: 224
    bit_offset: 4
    bit_width: 4
    type: u4
    enum_ref: Sff8636TxInputEqualization
    template: capability_advertisement
    scope: { module: true }
    since: "2.0"
    provenance: { section: "SFF-8636 v2.11 § 6.6.2", pdf_page: 61, table: "Table 6-29", quote: "Max Tx input equalization supported", lineage: "SFF-8636 Rev 2.12 change history, Rev 1.9: 'Added Page 03h Address 224 to define magnitude of Tx EQ and Rx Emph supported'" }

  - name: max_rx_output_emphasis
