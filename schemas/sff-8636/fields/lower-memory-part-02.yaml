    present_when: { field: page_00h_upper_administrative.tx_cdr_present, equals: true }
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 38, table: "Table 6-10", quote: "Channel Tx CDR Control" }

