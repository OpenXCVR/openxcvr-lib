fields:
  - name: rx_power_lane
    display_name: RxPowerLane<lane>
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "34 + 2 * (lane - 1)"
    size_bytes: 2
    type: u16be
    encoding: { kind: scaled_unsigned, lsb_units: "0.1 uW" }
    template: telemetry_lane
    tags: [Monitor, "Monitor::OpticalPower"]
    scope: { lane: lane }
    behavior: { measurement_kind_source: "page_00h_upper_administrative.rx_power_average" }
    provenance: { section: "SFF-8636 v2.11 § 6.2.5", pdf_page: 36, table: "Table 6-9", quote: "Internally measured Rx input power" }

  - name: tx_bias_lane
    display_name: TxBiasLane<lane>
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "42 + 2 * (lane - 1)"
    size_bytes: 2
    type: u16be
    encoding: { kind: scaled_unsigned, lsb_units: "2 uA" }
    template: telemetry_lane
    tags: [Monitor, "Monitor::BiasCurrent"]
    scope: { lane: lane }
    provenance: { section: "SFF-8636 v2.11 § 6.2.5", pdf_page: 36, table: "Table 6-9", quote: "Internally measured Tx bias" }

  - name: tx_power_lane
    display_name: TxPowerLane<lane>
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "50 + 2 * (lane - 1)"
    size_bytes: 2
    type: u16be
    encoding: { kind: scaled_unsigned, lsb_units: "0.1 uW" }
    template: telemetry_lane
    tags: [Monitor, "Monitor::OpticalPower"]
    scope: { lane: lane }
    provenance: { section: "SFF-8636 v2.11 § 6.2.5", pdf_page: 36, table: "Table 6-9", quote: "Internally measured Tx Power" }

  - name: tx_disable_lane
    display_name: Tx<lane>Disable
