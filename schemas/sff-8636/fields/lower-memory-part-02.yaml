    offset: 86
    bit_offset_expr: "lane - 1"
    bit_width: 1
    type: bool
    template: control
    scope: { lane: lane }
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 37, table: "Table 6-10", quote: "Read/Write bit for software disable" }

  - name: rx_rate_select_lane
    display_name: Rx<lane>RateSelect
    instances: { index: lane, start: 1, end: 4 }
    offset: 87
    bit_offset_expr: "2 * (lane - 1)"
    bit_width: 2
    type: u2
    enum_ref: Sff8636RateSelect
    template: control
    scope: { lane: lane }
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 37, table: "Table 6-10", quote: "Software rate select" }

  - name: tx_rate_select_lane
    display_name: Tx<lane>RateSelect
    instances: { index: lane, start: 1, end: 4 }
    offset: 88
    bit_offset_expr: "2 * (lane - 1)"
    bit_width: 2
    type: u2
    enum_ref: Sff8636RateSelect
    template: control
    scope: { lane: lane }
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 37, table: "Table 6-10", quote: "Software rate select" }

  - name: software_reset
    display_name: SwReset
    offset: 93
    bit_offset: 7
    bit_width: 1
    type: bool
    template: control
    behavior: { write_trigger: self_clearing, reset_domain: module }
    scope: { module: true }
    since: "2.11"
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 37, table: "Table 6-10", quote: "Software reset is a self-clearing bit", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.10: 'Added SW reset control at byte 93, bit 7'" }

  - name: high_power_class_enable_8
    display_name: HighPwrClassEnable8
    offset: 93
    bit_offset: 3
    bit_width: 1
    type: bool
    template: control
    scope: { module: true }
    present_when: { field: page_00h_upper_administrative.power_class_8_implemented, equals: true }
    since: "2.11"
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 37, table: "Table 6-10", quote: "Enables Power Class 8", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.10: 'Control for High Power Class 8 at byte 93, bit 3' per SFF-8679" }

  - name: high_power_class_enable_5_to_7
    display_name: HighPwrClassEnable5To7
    offset: 93
    bit_offset: 2
    bit_width: 1
    type: bool
    template: control
    scope: { module: true }
    since: "2.0"
    provenance: { section: "SFF-8636 v2.11 § 6.2.6", pdf_page: 37, table: "Table 6-10", quote: "Enables Power Classes 5 to 7", lineage: "SFF-8636 Rev 2.12 change history, Rev 1.9: 'Added Address 93 bit 2 High Power Class Enable'; byte 93 bits 7-2 reserved in the Rev 1.7 map" }

  - name: power_set
    display_name: PowerSet
