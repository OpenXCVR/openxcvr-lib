    since: "1.4"
    provenance: { section: "SFF-8636 v2.11 § 6.2.2", pdf_page: 31, table: "Table 6-4", quote: "Revision Compliance", lineage: "SFF-8636 Rev 2.12 change history, Rev 1.4: 'Added Revision Compliance Byte'" }

  - name: flat_memory
    display_name: FlatMem
    offset: 2
    bit_offset: 2
    bit_width: 1
    type: bool
    template: capability_flag
    scope: { module: true }
    flags: { is_required: true, is_readable: true, is_writable: false, is_ever_writable: false, is_dynamic: false }
    enum_inline:
      - { value: 0, name: paged, description: "Paging supported; at least upper page 03h is implemented" }
      - { value: 1, name: flat, description: "Flat memory; lower memory and upper page 00h only" }
    provenance: { section: "SFF-8636 v2.11 § 6.2.2", pdf_page: 31, table: "Table 6-3", quote: "Flat_mem" }

  - name: interrupt_deasserted
    display_name: IntL
    offset: 2
    bit_offset: 1
    bit_width: 1
    type: bool
    template: status
    scope: { module: true }
    read_effect: acknowledge_startup_interrupt
    read_effect_scope: byte
    read_effect_provenance:
      source: "SFF-8636 Rev 2.12 (SFF-8636-Rev2.12)"
      section: "§ 6.2.2"
      table: "Table 6-3"
      pdf_page: 31
      basis: "Table 6-3 note: 'The IntL bit will remain asserted until a read is performed of the Data_Not_Ready bit (Byte 2).' Reading the Data_Not_Ready bit is a read of Byte 2 (2-wire reads are byte-granular), so any read of Byte 2 acknowledges the power-up IntL assertion: the effect belongs to the whole byte, matching 'Upon completion of power-up reset, the free-side device shall assert the IntL output signal and bit (if supported) low while de-asserting the Data_Not_Ready bit low.'"
    enum_inline:
      - { value: 0, name: asserted, description: "IntL asserted" }
      - { value: 1, name: not_asserted, description: "IntL not asserted" }
    provenance: { section: "SFF-8636 v2.11 § 6.2.2", pdf_page: 31, table: "Table 6-3", quote: "IntL" }

  - name: data_not_ready
    display_name: DataNotReady
    offset: 2
    bit_offset: 0
    bit_width: 1
    type: bool
    template: status
    scope: { module: true }
    enum_inline:
      - { value: 0, name: monitor_data_valid, description: "Valid monitor data can be read" }
      - { value: 1, name: monitor_data_not_ready, description: "Free-side device does not yet have valid monitor data" }
    provenance: { section: "SFF-8636 v2.11 § 6.2.2", pdf_page: 31, table: "Table 6-3", quote: "Data_Not_Ready" }

