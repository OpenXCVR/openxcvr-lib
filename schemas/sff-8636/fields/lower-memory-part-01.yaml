  - name: rx_power_alarm_warning_flag
    display_name: LRx<lane>Power<severity>Flag
    instances: { index: bit, start: 0, end: 15 }
    offset_expr: "9 + bit / 8"
    bit_offset_expr: "4 * (1 - ((bit / 4) % 2)) + (3 - (bit % 4))"
    bit_width: 1
    type: bool
    template: flag
    tags: [Flag, AlarmFlag, "Monitor::OpticalPower"]
    scope: { lane: lane }
    behavior:
      latching: clear_on_read
      bit_order: "lane 1-4, each lane high_alarm, low_alarm, high_warning, low_warning (bit = 4 * (lane - 1) + severity)"
