    scope: { module: true }
    provenance: { section: "SFF-8636 v2.12 § 7.3.2", pdf_page: 87, table: "Table 7-4", quote: "Least significant bit of the day encoding", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: calibration_date_sequence
    since: "2.12"
    display_name: CalibrationDateNumber
    offset: 133
    bit_offset: 0
    bit_width: 7
    type: u7
    template: informational
    scope: { module: true }
    encoding: { valid_range: "0..126", invalid_value: 127 }
    provenance: { section: "SFF-8636 v2.12 § 7.3.2", pdf_page: 87, table: "Table 7-4", quote: "Number in the range 0 to 126", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

