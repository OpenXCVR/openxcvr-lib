    tags: [OperationalParameter, "Monitor::Timing"]
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4.5", pdf_page: 90, table: "Table 7-1", quote: "Delta_Rx_Max", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: delta_tx_max
    since: "2.12"
    display_name: DeltaTxMax
