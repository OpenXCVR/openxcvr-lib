    display_name: Stratum
    offset: 140
    size_bytes: 1
    type: u8
    template: informational
    scope: { module: true }
    encoding: { kind: generation, zero: "highest precision primary calibrator", ff: "unused or undefined" }
    provenance: { section: "SFF-8636 v2.12 § 7.3.4", pdf_page: 88, quote: "Calibration accuracy decreases with each calibrator generation", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: reserved_common_header
    since: "2.12"
    display_name: ReservedCommonHeader
    offset: 141
    size_bytes: 9
    type: bytes
    template: reserved
    scope: { module: true }
    provenance: { section: "SFF-8636 v2.12 § 7.3", pdf_page: 87, table: "Table 7-3", quote: "Common header section. Reserved 00h.", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  # ── Calibration format for Optical Modules (Format ID CA1Bh) ──────────────

  - name: optical_number_of_lanes
    since: "2.12"
    display_name: NbLanes
    offset: 150
    size_bytes: 1
    type: u8
    template: informational
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    behavior: { expected_value: 4, reason: "SFF-8636 supports four lanes" }
    provenance: { section: "SFF-8636 v2.12 § 7.4.1", pdf_page: 89, table: "Table 7-1", quote: "For SFF-8636 this value is 4", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: optical_operational_mode_id
    since: "2.12"
    display_name: OpModeId
    offset: 151
    size_bytes: 1
    type: u8
    template: operational_parameter
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    behavior: { default_value: 0, reason: "single operational mode is in scope" }
    provenance: { section: "SFF-8636 v2.12 § 7.4.2", pdf_page: 89, table: "Table 7-1", quote: "For SFF-8636 this value is 0", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: rx_power_delay_coefficient
    since: "2.12"
    display_name: RxPwrDly<degree>
    instances: { index: degree, start: 0, end: 4 }
    offset_expr: "152 + 3 * degree"
    size_bytes: 3
    type: bytes
    encoding: { kind: q8_16_signed, unit: "ns/dBm^degree" }
    template: informational
    tags: [Information, "Monitor::OpticalPower"]
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    behavior: { formula: "Rx_Pwr_Dly_Cor = sum(Rx_Pwr_Dly(k) * Rx_PWR_dBm^k), k=0..4" }
    provenance: { section: "SFF-8636 v2.12 § 7.4.3", pdf_page: 89, table: "Table 7-1", quote: "Rx_Pwr_Dly(0) through Rx_Pwr_Dly(4)", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: temperature_detune_offset
    since: "2.12"
    display_name: TDetuneOffset
    offset: 167
    size_bytes: 2
    type: i16be
    encoding: { kind: q8_8_signed, unit: "0.1 nm" }
    template: informational
    tags: [Information, "Monitor::Frequency"]
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4.4", pdf_page: 90, table: "Table 7-1", quote: "T_Detune_Offset", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: temperature_detune_slope
    since: "2.12"
    display_name: TDetuneSlope
    offset: 169
    size_bytes: 2
    type: i16be
    encoding: { kind: q8_8_signed, unit: "0.01 nm/deg C" }
    template: informational
    tags: [Information, "Monitor::Frequency"]
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4.4", pdf_page: 90, table: "Table 7-1", quote: "T_Detune_Slope", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: delta_rx_max
    since: "2.12"
    display_name: DeltaRxMax
    offset: 171
    size_bytes: 4
    type: u32be
    encoding: { kind: q16_16_unsigned, unit: "ns" }
