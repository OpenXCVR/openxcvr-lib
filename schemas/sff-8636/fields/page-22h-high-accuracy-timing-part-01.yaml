    offset: 211
    size_bytes: 44
    type: bytes
    template: reserved
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4", pdf_page: 84, table: "Table 7-1", quote: "Reserved 00h", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: cc_calib
    since: "2.12"
    display_name: CC_CALIB
    offset: 255
    size_bytes: 1
    type: u8
    encoding: { kind: checksum, covers: "Page 22h bytes 128-254", covers_range: [128, 254], algorithm: sum8 }
    template: informational
    scope: { module: true }
    provenance: { section: "SFF-8636 v2.12 § 7", pdf_page: 83, tables: ["Table 7-1", "Table 7-2"], quote: "Checkcode over bytes 128-254", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }
