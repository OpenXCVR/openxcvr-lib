fields:
  - name: format_id
    since: "2.12"
    display_name: FormatID
    offset: 128
    size_bytes: 2
    type: enum_ref
    enum_ref: Sff8636Page22hFormatId
    template: informational
    scope: { module: true }
    behavior: { valid_values: ["0xca1b optical module calibration", "0x100b loopback module calibration"], discovery: "host validates format ID and CC_CALIB before using page data" }
    provenance: { section: "SFF-8636 v2.12 § 7", pdf_page: 83, tables: ["Table 7-1", "Table 7-2"], quote: "Format ID determines if page 22h contains a valid entry", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: timing_format_version
    since: "2.12"
    display_name: Version
    offset: 130
    size_bytes: 1
    type: u8
    template: informational
    scope: { module: true }
    behavior: { expected_value: 0x01 }
    provenance: { section: "SFF-8636 v2.12 § 7.3.1", pdf_page: 87, table: "Table 7-3", quote: "This version number shall be 01h", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: calibration_date_year
    since: "2.12"
    display_name: CalibrationDateYear
    offset: 131
    size_bytes: 1
    type: u8
    template: informational
    scope: { module: true }
    encoding: { kind: offset_year, base_year: 2000, invalid_value: 0xff }
    provenance: { section: "SFF-8636 v2.12 § 7.3.2", pdf_page: 87, table: "Table 7-4", quote: "YEAR = Byte131 + 2000", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: calibration_date_month
    since: "2.12"
    display_name: CalibrationDateMonth
    offset: 132
    bit_offset: 4
    bit_width: 4
    type: u4
    template: informational
    scope: { module: true }
    provenance: { section: "SFF-8636 v2.12 § 7.3.2", pdf_page: 87, table: "Table 7-4", quote: "MONTH = Byte132.7-4", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: calibration_date_day_high
    since: "2.12"
    display_name: CalibrationDateDayHigh
    offset: 132
