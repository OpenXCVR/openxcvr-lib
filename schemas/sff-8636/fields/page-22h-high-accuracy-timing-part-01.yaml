    size_bytes: 4
    type: u32be
    encoding: { kind: q16_16_unsigned, unit: "ns" }
    template: operational_parameter
    tags: [OperationalParameter, "Monitor::Timing"]
    scope: { module: true }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4.5", pdf_page: 90, table: "Table 7-1", quote: "Delta_Tx_Max", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: average_rx_lane_delay
    since: "2.12"
    display_name: AvgRxLane<lane>
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "179 + 8 * (lane - 1)"
    size_bytes: 4
    type: u32be
    encoding: { kind: q16_16_unsigned, unit: "ns" }
    template: operational_parameter
    tags: [OperationalParameter, "Monitor::Timing"]
    scope: { lane: lane }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4.6", pdf_page: 91, table: "Table 7-1", quote: "Average Receiving delay on Lane", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: average_tx_lane_delay
    since: "2.12"
    display_name: AvgTxLane<lane>
    instances: { index: lane, start: 1, end: 4 }
    offset_expr: "183 + 8 * (lane - 1)"
    size_bytes: 4
    type: u32be
    encoding: { kind: q16_16_unsigned, unit: "ns" }
    template: operational_parameter
    tags: [OperationalParameter, "Monitor::Timing"]
    scope: { lane: lane }
    present_when: "format_id == 0xca1b"
    provenance: { section: "SFF-8636 v2.12 § 7.4.7", pdf_page: 91, table: "Table 7-1", quote: "Average Transmitting delay on Lane", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: reserved_optical_calibration_tail
    since: "2.12"
