  - name: calibration_unique_identifier_osi
    since: "2.12"
    display_name: CUIOSI
    offset: 137
    size_bytes: 3
    type: bytes
    template: informational
    scope: { module: true }
    provenance: { section: "SFF-8636 v2.12 § 7.3.3", pdf_page: 88, table: "Table 7-5", quote: "Organization Specific Identifier", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

  - name: calibration_stratum
