  # Lanes 2-4 pack contiguously in 12-byte strides from byte 170
  # (§ 7.5.2-7.5.4: Bytes 170-173+(N-2)*12 and siblings); lane 1's row is the
  # scalar fields above.
  - name: loopback_tx_to_rx_delay
    since: "2.12"
    display_name: Tx<lane>ToRx<lane>Delay
    instances: { index: lane, start: 2, end: 4 }
    offset_expr: "170 + 12 * (lane - 2)"
    size_bytes: 4
    type: u32be
    encoding: { kind: q16_16_unsigned, unit: "ns" }
    template: operational_parameter
    tags: [OperationalParameter, "Monitor::Timing"]
    scope: { lane: lane }
    present_when: "format_id == 0x100b"
    provenance: { section: "SFF-8636 v2.12 § 7.5.2", pdf_page: 92, table: "Table 7-2", quote: "TxN to RxN Delay", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added new section 7 with optional High Accuracy Timing registers using page 22h'" }

