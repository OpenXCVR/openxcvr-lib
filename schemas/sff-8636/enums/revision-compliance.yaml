schema: openxcvr.enum.v2
kind: enum
id: Sff8636RevisionCompliance
title: SFF-8636 Revision Compliance Codes
spec:
  id: sff-8636
  revision: "2.11"
provenance:
  spec: SFF-8636 v2.11 § 6.2.2
  table: "Table 6-4"
  pdf_pages: [31]
entries:
  - value: 0x00
    name: revision_not_specified
    since: "1.4"
    description: Revision not specified; not used for SFF-8636 rev 2.5 or higher
    provenance: "SFF-8636 Rev 2.12 change history, Rev 1.4: 'Added Revision Compliance Byte'"
  - value: 0x01
    name: sff8436_rev_4_8_or_earlier
    since: "1.4"
    description: SFF-8436 Rev 4.8 or earlier
    provenance: "SFF-8636 Rev 2.12 change history, Rev 1.4: 'Added Revision Compliance Byte'"
  - value: 0x02
    name: sff8436_rev_4_8_variant
    since: "1.4"
    description: SFF-8436 Rev 4.8 or earlier except this byte and bytes 186-189 follow SFF-8636
    provenance: "SFF-8636 Rev 2.12 change history, Rev 1.4: 'Added Revision Compliance Byte'"
  - value: 0x03
    name: sff8636_rev_1_3_or_earlier
    since: "1.4"
    description: SFF-8636 Rev 1.3 or earlier
    provenance: "SFF-8636 Rev 2.12 change history, Rev 1.4: 'Added Revision Compliance Byte' (code names 1.3-or-earlier)"
  - value: 0x04
    name: sff8636_rev_1_4
    since: "1.4"
    description: SFF-8636 Rev 1.4
    provenance: "SFF-8636 Rev 2.12 change history, Rev 1.4: 'Added Revision Compliance Byte'"
  - value: 0x05
    name: sff8636_rev_1_5
    since: "1.5"
    description: SFF-8636 Rev 1.5
    provenance: "SFF-8636 Rev 2.12 change history, Rev 1.5 published the 05h code for Rev 1.5"
  - value: 0x06
    name: sff8636_rev_2_0
    since: "2.0"
    description: SFF-8636 Rev 2.0
    provenance: "SFF-8636 Rev 2.12 change history, Rev 2.0: 'Changed revision register compliance bit for revision 1.9 to 2.0 (1.9 was never released)'"
  - value: 0x07
    name: sff8636_rev_2_5_to_2_7
    since: "2.5"
    description: SFF-8636 Rev 2.5, 2.6, and 2.7
    provenance: "SFF-8636 Rev 2.12 change history, Rev 2.5: 'Table 6-3 added value 07h for rev 2.5'"
  - value: 0x08
    name: sff8636_rev_2_8_to_2_10
    since: "2.8"
    description: SFF-8636 Rev 2.8, 2.9, and 2.10
    provenance: "SFF-8636 Rev 2.12 change history, Rev 2.9 publication: 'Table 6-3 Revision Compliance: Added 08h for SFF-8636 Rev 2.8'"
  - value: 0x09
    name: sff8636_rev_2_11
    description: SFF-8636 Rev 2.11
    since: "2.11"
    provenance:
      lineage: "SFF-8636 Rev 2.12 Table 6-4: code 09h names SFF-8636 Rev 2.11"
      spec: SFF-8636 Rev 2.12 § 6.2.2
      table: "Table 6-4"
      pdf_pages: [33]
  - value: 0x0a
    name: sff8636_rev_2_12
    description: SFF-8636 Rev 2.12
    since: "2.12"
    provenance:
      lineage: "SFF-8636 Rev 2.12 change history, Rev 2.12: 'Added codes to Table 6-4'"
      spec: SFF-8636 Rev 2.12 § 6.2.2
      table: "Table 6-4"
      pdf_pages: [33]
  - value: 0x0b..0xff
    name: reserved
    description: Reserved
