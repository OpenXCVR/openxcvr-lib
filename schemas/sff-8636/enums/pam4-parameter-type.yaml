    tags: [ber, pam4]
  - value: 0x0d
    name: fer_latched_min_line_ingress
    description: FER latched minimum since last read, line ingress
    tags: [fer, pam4, latched]
  - value: 0x0e
    name: fer_latched_max_line_ingress
    description: FER latched maximum since last read, line ingress
    tags: [fer, pam4, latched]
  - value: 0x0f
    name: fer_prior_period_line_ingress
    description: FER prior period, line ingress
    tags: [fer, pam4]
  - value: 0x10
