    tags: [dispersion, pam4]
  - value: 0x03
    name: pam4_level_transition_line_ingress
    description: PAM4 level transition parameter, line ingress
    tags: [pam4]
  - value: 0x04
    name: pre_fec_ber_average_line_ingress
    description: Pre-FEC BER average, line ingress
    tags: [ber, pam4]
  - value: 0x05
    name: fer_average_line_ingress
    description: FER average, line ingress
    tags: [fer, pam4]
  - value: 0x06
    name: tec_current
    description: TEC current
    tags: [dwdm]
  - value: 0x07
    name: laser_frequency
    description: Laser frequency difference
    tags: [dwdm]
  - value: 0x08
    name: laser_temperature
    description: Laser temperature difference
    tags: [dwdm]
  - value: 0x09
    name: pre_fec_ber_latched_min_line_ingress
    description: Pre-FEC BER latched minimum since last read, line ingress
    tags: [ber, pam4, latched]
  - value: 0x0a
    name: pre_fec_ber_latched_max_line_ingress
