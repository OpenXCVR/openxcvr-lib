  - name: param_value
    since: "2.11"
    display_name: Param<param>Value
    instances: { index: param, start: 1, end: 24 }
    offset_expr: "152 + 2 * (param - 1)"
    size_bytes: 2
    type: x16be
    variants:
      discriminator: { field: "parameter_type[param]" }
      cases:
        - { when: { value: 0x00 }, type: u16be, description: "Parameter not supported; value ignored" }
        - { when: { value: 0x01 }, type: u16be, scale: "1/256", unit: dB, description: "SNR, line ingress" }
        - { when: { value: 0x02 }, type: i16be, scale: 0.1, unit: ps/nm, description: "Residual ISI or dispersion" }
        - { when: { value: 0x03 }, type: u16be, scale: "1/256", unit: dB, description: "PAM4 level transition parameter" }
        - { when: { range: [0x04, 0x05] }, type: f16be, description: "Average BER or FER using SFF-8636 base-10 F16 encoding" }
        - { when: { value: 0x06 }, type: i16be, scale: 0.1, unit: mA, description: "TEC current" }
        - { when: { value: 0x07 }, type: i16be, scale: 10, unit: MHz, description: "Laser frequency difference" }
        - { when: { value: 0x08 }, type: i16be, scale: "1/256", unit: deg_C, description: "Laser temperature difference" }
        - { when: { range: [0x09, 0x10] }, type: f16be, description: "Latched, prior, or current BER/FER using SFF-8636 base-10 F16 encoding" }
        - { when: { range: [0x11, 0xff] }, type: u16be, description: "Reserved or vendor-specific parameter carried as raw U16" }
    template: telemetry_module
    tags: [Monitor, PAM4]
    scope: { parameter: param }
    provenance: { section: "SFF-8636 v2.11 § 6.7.2.4", pdf_page: 71, table: "Table 6-40", quote: "Real-Time Value Registers", lineage: "SFF-8636 Rev 2.12 change history, Rev 2.10/2.11: 'Added PAM4 monitoring Upper Pages 20h and 21h' (settled design W1)" }

